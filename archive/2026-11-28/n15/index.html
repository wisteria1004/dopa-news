<small>DOPE・11月28日号</small>
<h1>米東部の感謝祭を嵐直撃、90万軒停電</h1>
<p>米国東部は感謝祭の26日、強い風と大雨を伴う嵐に見舞われ、90万を超える家庭や事業所が停電した。ニューヨークのメーシーズの感謝祭パレードは、史上初めて天候を理由に土曜日に延期された。</p>
