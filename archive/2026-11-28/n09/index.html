<small>DOPE・11月28日号</small>
<h1>カナダ最高裁、宗教シンボル禁止法を支持</h1>
<p>カナダ最高裁は27日、教師や警察官などが職務中に宗教的なシンボルを身につけることを禁じたケベック州の法律を、大筋で有効と判断した。州が憲法の権利規定を一時的に外す「適用除外条項」を使ったことも認めた。</p>
