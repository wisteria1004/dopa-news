<small>DOPE・11月28日号</small>
<h1>マリニン、SPで世界最高114.81点</h1>
<p>フィギュアスケートのGPシリーズ最終戦、NHK杯が27日に東京で開幕し、男子ショートプログラムで米国のマリニン選手が114.81点の世界最高得点を出して首位に立った。佐藤駿選手が2位、女子は千葉百音選手が首位で発進した。</p>
