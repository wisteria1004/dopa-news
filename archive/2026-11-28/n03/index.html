<h1>NZ総選挙、与党連合が過半数割れ</h1>
<p>ニュージーランドの選挙管理委員会は27日、11月7日に行われた総選挙の最終結果を発表し、ラクソン首相の与党連合は65議席と、過半数に1議席届かなかった。7議席を得た新党のオポチュニティー党が、次の政権の行方を握る。</p>
