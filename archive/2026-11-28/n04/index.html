<small>DOPE・11月28日号</small>
<h1>ロケットラボ、年22回の打ち上げ新記録</h1>
<p>米ロケットラボは27日、ニュージーランドから小型ロケット「エレクトロン」を打ち上げ、日本のシンスペクティブのレーダー衛星を予定の軌道に届けた。今年22回目の打ち上げで、このロケットの年間最多を更新した。</p>
