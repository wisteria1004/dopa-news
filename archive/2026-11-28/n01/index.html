<h1>ホルムズ海峡でタンカーまた爆発</h1>
<p>イランの革命防衛隊海軍は27日、ホルムズ海峡で「許可されていない航路」を通ろうとしたタンカーが機雷に触れて爆発し、炎上したと発表した。米国の海上封鎖が続くなか、原油輸送の要所で船の被害が相次いでいる。</p>
