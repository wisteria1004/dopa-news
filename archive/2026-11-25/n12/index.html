<h1>ティグライ砲撃、戦争犯罪の調査を</h1>
<p>国際人権団体アムネスティ・インターナショナルは23日、エチオピア軍と政府側の民兵が9月にティグライ州南部のアラマタを3日間砲撃し、市民14人が死亡したとして、戦争犯罪として調べるよう求めた。2020〜22年の内戦が再び燃え上がるなかでの報告だ。</p>
