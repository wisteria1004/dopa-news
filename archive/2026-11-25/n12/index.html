<h1>スウェーデン、組閣難航72日で首相採決へ</h1>
<p>スウェーデン議会のノーレン議長は24日、穏健党のクリステション党首を首相候補に指名し、30日に議会で採決すると発表した。9月の総選挙から72日間、正式な政権がない状態が続いている。</p>
