<h1>日経平均2207円高、AI半導体に買い戻し</h1>
<p>24日の東京市場で日経平均株価は2207円高の5万8644円となり、韓国総合株価指数も6%余り上がった。前日の米国市場で半導体大手エヌビディアの株価が急騰した流れを受けた。</p>
