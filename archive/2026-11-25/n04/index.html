<h1>中国の宇宙船にパキスタン人飛行士</h1>
<p>中国は25日朝、有人宇宙船「神舟24号」を打ち上げ、宇宙ステーション「天宮」につなげた。乗員3人のうち1人はパキスタン人で、天宮に外国人が乗るのは初めてだ。</p>
