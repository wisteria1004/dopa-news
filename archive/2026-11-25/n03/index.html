<small>DOPE・11月25日号</small>
<h1>中国、上海トップの陳吉寧氏を調査</h1>
<p>中国共産党の中央規律検査委員会は24日、政治局員で上海市のトップを務める陳吉寧氏を、重大な規律違反と法律違反の疑いで調べていると発表した。上海のトップは最高指導部への登竜門とされ、習近平国家主席の反腐敗運動が党の中枢に及んでいる。</p>
