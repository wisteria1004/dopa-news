<h1>日本、ICC分担金を前倒しで全額支払いへ</h1>
<p>高市首相は24日、ICCの赤根智子所長と会い、2027年分の分担金を年内に全額払うと伝えた。米国の制裁が本格化する前に、裁判所の資金を確保する狙いがある。</p>
