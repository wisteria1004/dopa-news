<small>DOPE・11月25日号</small>
<h1>コンゴ、コバルト輸出を再び停止</h1>
<p>コンゴ民主共和国は24日、30日からすべてのコバルトの輸出を当面止めると発表した。世界の産出量の4分の3近くを占める国の決定で、電気自動車やスマートフォンの電池に使う金属の値動きに影響しそうだ。</p>
