<style>
/* VOICE: 刺激は強いけど中身は本物。速く掴めて、その場で深掘りできる
   IDEA: ショート動画のフィード。縦で次の話題、横でそのニュースの奥へ
   PICTURE: 記事ごとのアクセント色の光とぼかした塊、ハーフトーン、巨大なアウトライン番号
   COLOUR and TYPE: #08080d の黒地に記事ごとの1色。Zen Kaku Gothic New 900 + Anton
   LAYOUT: 上に虹色の進捗と日付、左にドット列、中央に1枚、下に位置と「次のニュース」 */
:root{color-scheme:dark;--bg:#08080d;--ink:#f5f3ee;--mute:#a39da8;--line:#34303b;
--pink:#ff2e88;--yel:#ffd60a;--org:#ff6b1a;--blue:#2e7bff;--lime:#b6ff2e;--pur:#8b5cff;--cyan:#19e3ff;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.7 "Zen Kaku Gothic New",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,a:focus-visible,.track:focus-visible{outline:2px solid var(--yel);outline-offset:3px}
a{color:inherit}
.prog{position:fixed;top:0;left:0;right:0;height:4px;z-index:9;background:#1a1720}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--org),var(--yel),var(--lime),var(--cyan),var(--blue),var(--pur));transition:width .35s}
.app{height:100dvh;display:flex;flex-direction:column;max-width:620px;margin:0 auto;position:relative}
header{padding:calc(8px + var(--st)) 14px 6px;position:absolute;top:0;left:0;right:0;z-index:5;background:rgba(8,8,13,.38);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.07)}
.top{display:flex;align-items:center;gap:8px}
.date{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.06em;color:#d9d3dd;white-space:nowrap}
.live{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.3}}
.latest{display:inline-flex;align-items:center;text-decoration:none;color:var(--yel)}
.latest[hidden]{display:none}
.how{margin-left:auto;display:inline-flex;align-items:center;gap:5px;min-height:40px;margin-block:-4px;padding:0 4px 0 8px;color:var(--mute);font-weight:900;font-size:12px;white-space:nowrap}
.how svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.how:hover{color:var(--ink)}
.pill{white-space:nowrap;border:1px solid var(--line);background:#121018;border-radius:999px;padding:0 12px;min-height:32px;font-weight:900;font-size:12px}
.chips{display:flex;gap:20px;overflow-x:auto;margin-top:2px;padding:0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:0 1px;min-height:38px;font-weight:900;font-size:14px;color:var(--mute);border-bottom:2px solid transparent;transition:color .2s,border-color .25s}
.chip:hover{color:var(--ink)}
.chip b{font:400 13px Anton,sans-serif;margin-left:5px;color:var(--mute)}
.chip[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--a,var(--pink))}
.dots{position:absolute;left:5px;top:52%;transform:translateY(-50%);display:flex;flex-direction:column;gap:7px;z-index:6;pointer-events:none}
.dots i{width:5px;height:5px;border-radius:50%;background:#4a4452;transition:height .25s,background .25s}
.dots i.on{height:18px;border-radius:3px;background:var(--ink)}
.feed{flex:1;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;display:flex;flex-direction:column;padding-top:var(--hh,90px);padding-bottom:var(--fh,56px);
background:radial-gradient(85% 60% at 80% 8%,color-mix(in srgb,var(--a) 50%,transparent),transparent 70%),radial-gradient(70% 50% at 0% 100%,color-mix(in srgb,var(--a) 22%,transparent),transparent 70%),var(--bg)}
.card::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.4px);background-size:14px 14px;-webkit-mask:linear-gradient(180deg,transparent,#000 35%,#000 70%,transparent);mask:linear-gradient(180deg,transparent,#000 35%,#000 70%,transparent);pointer-events:none}
.blob{position:absolute;width:62vw;max-width:340px;aspect-ratio:1;border-radius:50%;background:var(--a);filter:blur(70px);opacity:.28;right:-18%;top:30%;pointer-events:none}
.num{position:absolute;right:-4px;top:calc(var(--hh,90px) - 10px);font:400 clamp(150px,44vw,240px)/1 Anton,sans-serif;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.2);pointer-events:none}
.track{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;position:relative;z-index:1}
.track::-webkit-scrollbar{display:none}
.pane{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;padding:48px 70px 24px 26px;overflow-y:hidden;display:flex;flex-direction:column}
.pane.tall{overflow-y:auto;overscroll-behavior-y:auto}
.pane>.in{margin:auto 0}
.hint{position:absolute;top:calc(var(--hh,90px) + 12px);left:26px;font-size:13px;letter-spacing:.2em;color:var(--mute);z-index:2}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tag{font-weight:900;font-size:13px;padding:4px 12px;border-radius:6px;background:var(--a);color:#0b0a0e;letter-spacing:.08em}
.tag.o{background:transparent;border:1px solid #6b6372;color:var(--ink)}
.tag.w{background:var(--ink)}
.tag.y{background:var(--yel)}
h2{font-weight:900;font-size:clamp(27px,7.8vw,40px);line-height:1.22;margin:0 0 18px;text-wrap:balance}
h2 span,.k{color:var(--a)}
.ph{display:inline-block}
h2 .ph{color:inherit}
.k{font-weight:900}
.lead{font-size:16px;line-height:1.9;margin:0;border-left:3px solid rgba(255,255,255,.2);padding-left:14px}
.big{font-weight:900;font-size:clamp(19px,5.2vw,23px);line-height:1.75;margin:0;letter-spacing:.02em}
.big.xl{font-size:clamp(20px,5.6vw,25px);line-height:1.75;letter-spacing:.02em}
.src{margin-top:16px;font-size:14px;color:var(--mute);display:flex;gap:10px 14px;flex-wrap:wrap}
.src a{color:var(--ink);text-underline-offset:4px}
.go{margin-top:16px;font-size:14px;color:var(--mute);letter-spacing:.12em}
.backno{color:var(--ink);text-underline-offset:4px}
.go span{color:var(--a)}
.who{font-weight:900;font-size:21px;line-height:1.35}
.role{color:var(--mute);font-size:14px;margin:2px 0 14px}
.note{margin-top:14px;font-size:13px;color:var(--mute);line-height:1.7}
.slist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.slist li{border-top:1px solid var(--line);padding-top:10px;font-size:15px}
.slist small{display:block;color:var(--mute);font-size:13px}
.rail{position:absolute;right:12px;bottom:calc(var(--fh,56px) + 46px);z-index:3}
.like{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(18,16,24,.75);display:grid;place-items:center}
.like svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2}
.like[aria-pressed=true] svg{fill:var(--pink);stroke:var(--pink)}
.bars{display:flex;gap:5px;padding:0 26px 12px;position:relative;z-index:1}
.bars i{height:4px;width:20px;border-radius:2px;background:#3b3542;transition:width .25s,background .25s}
.bars i.on{width:34px;background:var(--a)}
.end .pane{padding-right:34px}
.end h2{font-size:clamp(28px,8vw,40px)}
.end ol{margin:0 0 6px;padding-left:1.3em;display:grid;gap:8px}
.end li{font-size:16px;line-height:1.7}
.mix{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.mix div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mix b{display:block;font:400 34px/1 Anton,sans-serif}
.mix small{color:var(--mute);font-size:13px}
.recap{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.recap button{width:100%;text-align:left;min-height:44px;padding:8px 0;border-top:1px solid var(--line);font-size:15px;display:flex;gap:10px}
.recap button b{font:400 18px Anton,sans-serif;color:var(--mute);width:2em;flex:none}
/* 用語は普通の文字と同じように途中で折り返せるよう、ボタンではなくインライン要素にしている */
.g{display:inline;font:inherit;color:inherit;text-decoration:none;padding:0;border-bottom:1.5px dotted rgba(245,243,238,.55);cursor:help;line-height:inherit;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.g[aria-expanded=true]{border-bottom-style:solid;border-color:var(--yel)}
.pop{position:fixed;z-index:20;max-width:min(280px,calc(100vw - 32px));background:#1b1822;border:1px solid #4a4452;border-radius:12px;padding:12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.55);font-size:15px;line-height:1.65;font-weight:500}
.pop b{display:block;font-weight:900;font-size:15px;color:var(--yel);margin-bottom:2px}
.pop[hidden]{display:none}
.pop.wide{width:min(320px,calc(100vw - 24px));max-width:none}
.mapbox{position:relative;margin-top:10px;border-radius:10px;overflow:hidden;background:#0d1320;border:1px solid #2e3442}
.mapbox svg{display:block;width:100%;height:180px;touch-action:none;cursor:grab}
.mapbox svg:active{cursor:grabbing}
.zoom{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.zoom button{width:34px;height:34px;border-radius:8px;background:rgba(27,24,34,.9);border:1px solid #4a4452;font-weight:900;font-size:18px;line-height:1}
.zoom button.s{font-size:11px;width:auto;padding:0 6px;white-space:nowrap}
.maphint{font-size:12px;color:var(--mute);margin-top:6px}
.pop small{display:inline-block;font-size:12px;font-weight:900;color:#0b0a0e;background:var(--lime);border-radius:4px;padding:0 6px;margin-bottom:4px}
.ring{animation:ring 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{transform:scale(.4);opacity:.9}to{transform:scale(2.2);opacity:0}}
.rail{display:flex;flex-direction:column;gap:10px}
.share svg{fill:none}
.toast{position:fixed;left:50%;bottom:calc(88px + var(--sb));transform:translateX(-50%);z-index:30;background:#1b1822;border:1px solid #4a4452;border-radius:12px;padding:10px 14px;font-size:14px;max-width:calc(100vw - 32px);overflow-wrap:anywhere}
.toast[hidden]{display:none}
.others .pane{padding-right:26px;justify-content:flex-start}
.olist{list-style:none;margin:0;padding:0}
.olist li{border-top:1px solid var(--line);padding:11px 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline}
.olist i{font-style:normal;font-size:12px;font-weight:900;color:#0b0a0e;background:var(--c);border-radius:4px;padding:1px 6px;white-space:nowrap}
.olist b{font-weight:700;font-size:16px;line-height:1.55}
.olist small{grid-column:2;color:var(--mute);font-size:13px}
.olist a{color:var(--ink);text-underline-offset:3px}
footer{display:flex;align-items:center;gap:10px;padding:6px 14px calc(8px + var(--sb));position:absolute;bottom:0;left:0;right:0;z-index:5;background:rgba(8,8,13,.38);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-top:1px solid rgba(255,255,255,.07)}
.pos{font:400 22px/1 Anton,sans-serif}.pos small{font-size:15px;color:var(--mute)}
.next{margin-left:auto;border-radius:999px;padding:0 18px;height:42px;font-weight:900;font-size:14px;color:#1a1206;background:linear-gradient(90deg,var(--yel),var(--org));box-shadow:0 0 18px rgba(255,150,20,.3);display:flex;align-items:center;gap:6px}
.date{min-height:32px;padding:0 9px 0 10px;border:1px solid var(--line);border-radius:999px;background:#121018}
.date svg{width:13px;height:13px;fill:none;stroke:var(--mute);stroke-width:3}
.date[aria-expanded=true]{border-color:var(--yel)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{position:fixed;inset:0;z-index:25;background:rgba(4,4,8,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:620px;background:#15131b;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:14px 0 calc(16px + var(--sb));box-shadow:0 -12px 40px rgba(0,0,0,.5)}
.shead{display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.shead b{font-weight:900;font-size:18px}
.snote0{margin:2px 16px 10px;font-size:13px;color:var(--mute)}
.strip{position:relative;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;overscroll-behavior-x:contain;padding:4px 16px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex:0 0 150px;scroll-snap-align:start;scroll-margin-left:16px;display:flex;flex-direction:column;gap:5px;min-height:150px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#1b1822;text-decoration:none;color:var(--ink)}
.day.here{border-color:var(--yel);box-shadow:inset 0 0 0 1px var(--yel)}
.dtop{display:flex;align-items:baseline;gap:6px}
.dtop b{font:400 28px/1 Anton,sans-serif}
.dtop small{color:var(--mute);font-size:13px;font-weight:900}
.badges{display:flex;gap:4px;min-height:19px}
.badges i{font-style:normal;font-size:11px;font-weight:900;border-radius:4px;padding:1px 6px;color:#0b0a0e;background:var(--lime)}
.badges i.now{background:var(--yel)}
.dn{font-size:12px;color:var(--mute)}
.dt{font-size:14px;line-height:1.5;font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.snote{margin:0;padding:8px 0;font-size:14px;color:var(--mute)}
.snote a{color:var(--ink);text-underline-offset:4px}
.sall{display:inline-block;margin:6px 16px 0;font-size:14px;font-weight:900;color:var(--yel);text-underline-offset:4px}
.grab{width:40px;height:4px;border-radius:2px;background:#4a4452;margin:0 auto 10px}
.shtitle{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
.shbtns{display:flex;flex-direction:column;gap:10px;padding:4px 16px 0}
.shb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:64px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:#1b1822;text-align:left}
.shb b{font-weight:900;font-size:17px}
.shb small{font-size:13px;color:var(--mute)}
.shb.main{background:var(--ink);color:#0b0a0e;border-color:var(--ink)}
.shb.main small{color:#4a4452}
.shc{align-self:center;min-height:44px;padding:0 12px;font-weight:900;font-size:14px;color:var(--mute);text-decoration:underline;text-underline-offset:4px}
.sitebtn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 22px;margin:4px 0 18px;border-radius:999px;background:var(--ink);color:#0b0a0e;font-weight:900;font-size:16px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 18px}
.btnrow .sitebtn{margin:0}
.sitebtn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.steps{margin:4px 16px 0;padding-left:1.4em;font-size:16px;line-height:1.7}
.steps li{margin:6px 0}
.steps b{font-weight:900}
.sitebtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-reduced-motion:reduce){.live,.ring{animation:none}.prog i,.bars i,.dots i,.chip{transition:none}.feed,.track{scroll-behavior:auto}}
@media(max-width:400px){.top{gap:6px}.date,.pill{padding:0 9px}}
@media(max-width:350px){.yr{display:none}}
@media(max-width:380px){.pane{padding-left:22px;padding-right:66px}.hint{left:20px}}
@media(min-width:900px){.app{border-inline:1px solid #16141b}}
</style>
</head>
<body>
<div class="prog" aria-hidden="true"><i id="prog"></i></div>
<div class="app">
<header>
  <div class="top">
    <button class="date" id="dateBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="sheet"><span class="live" aria-hidden="true"></span><span id="today">2026.11.24 TUE</span><span class="sr">・号をえらぶ</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <a class="pill latest" id="latest" href="#" hidden>最新号へ</a>
    <button class="how" id="how" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.7"/><circle cx="12" cy="17.2" r=".6"/></svg>選び方</button>
  </div>
  <div class="chips" id="chips" role="toolbar" aria-label="カテゴリ"></div>
</header>
<div class="dots" id="dots" aria-hidden="true"></div>
<main class="feed" id="feed"></main>
<footer>
  <span class="pos" aria-live="polite"><span id="cur">1</span> <small>/ <span id="tot">–</span></small></span>
  <button class="next" id="next" type="button"><span id="nextL">次のニュース</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg></button>
</footer>
</div>

<div class="pop" id="pop" role="note" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="sheet" id="appSheet" role="dialog" aria-modal="true" aria-labelledby="appT" hidden>
  <div class="panel">
    <div class="grab" aria-hidden="true"></div>
    <div class="shead"><b id="appT">ホーム画面に追加</b><button class="pill" id="appX" type="button">閉じる</button></div>
    <p class="snote0">アプリのように、ホーム画面のアイコンから全画面で開けます。一度開いた号は、電波が弱い所でも読めます。</p>
    <ol class="steps" id="appSteps"></ol>
  </div>
</div>
<div class="sheet" id="shareSheet" role="dialog" aria-modal="true" aria-labelledby="shareT" hidden>
  <div class="panel">
    <div class="grab" aria-hidden="true"></div>
    <div class="shead"><b id="shareT">シェア</b><button class="pill" id="shX" type="button">閉じる</button></div>
    <p class="snote0 shtitle" id="shareTitle"></p>
    <div class="shbtns">

{"cat":"tech","loc":[37.37,-121.96,"米カリフォルニア州サンタクララ"],"region":"北米","title":"NVIDIA、辞任した<span>フアン氏</span>をCEOに戻す","lead":"米半導体大手NVIDIAの取締役会は23日、11日前に辞任したジェンスン・フアン氏をCEOに戻すことを全会一致で決めた。トランプ大統領は自分が取締役会を説得したと語り、政府が企業のトップ人事に関わったとして批判が出ている。","src":{"name":"PBS（AP通信）","date":"11月23日","url":"https://www.pbs.org/newshour/nation/nvidia-board-unanimously-reinstates-jensen-huang-as-ceo-and-chairman"},"gist":"AI向けの半導体で世界を引っ張る会社のトップ人事に、大統領が直接かかわった。株価は大きく揺れ、議会は調べる構えを見せている。","detail":["フアン氏は、情報当局が中国のスパイの可能性を疑っていたと報じられた女性との関係をめぐり、11月12日に辞任していた。","取締役会は、米政府高官の意見をふまえて安全保障上の危険はないと判断し、独立取締役による安全保障と輸出管理の委員会を新たに設けた。","NVIDIAの株価は23日に約31%上がったが、24日は5.86%下がって155.38ドルで終えた。"],"kw":["全会一致","安全保障"],"views":[{"type":"当事者の声","who":"ドナルド・トランプ","role":"米国大統領","stance":"「取引をまとめた」","text":"CNBCの電話取材で、自分が取締役会と話して説得し、取引をまとめたと述べた。フアン氏を失うことは脅威になるとも語った。","media":"KATV（CNBCの取材を引用）","url":"https://katv.com/news/nation-world/trump-says-he-convinced-nvidia-to-reinstate-jensen-huang-i-made-the-deal-chinese-spy-megaspeed-rrt"},{"type":"分析・データ","who":"バーンスタイン","role":"米国の証券会社（アナリストの分析）","stance":"評価は上げ、経緯は批判","text":"NVIDIA株の投資判断を引き上げた一方で、辞任から復帰までの取締役会の迷走を「道化のようだ」と評した。","media":"ヤフー・ファイナンス","url":"https://finance.yahoo.com/markets/stocks/live/nvidia-live-updates-jensen-huang-reinstated-as-ceo-trump-says-he-convinced-board-165423793.html"}],"accent":"#ff2e88"},
{"cat":"world","loc":[24.76,46.64,"サウジアラビア・リヤド"],"region":"中東","title":"フーシ派、リヤドの<span>高層ビル</span>を再び攻撃","lead":"イエメンの武装組織フーシ派の攻撃が24日、サウジアラビアの首都リヤドの金融街にあるビルに当たり、11人が負傷した。リヤドが攻撃を受けたのは1週間足らずで2回目となる。","src":{"name":"ザ・ニュー・アラブ","date":"11月24日","url":"https://www.newarab.com/news/11-injured-houthis-strike-riyadh-second-time-week"},"gist":"イランと米国のにらみ合いが続くなか、攻撃がサウジアラビアの経済の中心にまで届いた。ホルムズ海峡でも、船の被害の発表が相次いでいる。","detail":["攻撃はキング・アブドラ金融地区のビルに当たった。目撃者は、政府系ファンドPIFの本部が入る国内で最も高いビルだと話している。","19日にはPIFの本部ビルがミサイル攻撃を受けて壊れたが、このときはけが人はいなかった。","イラン海軍は24日、ホルムズ海峡の東で石油タンカー2隻が機雷に触れて火災になったと発表した。"],"kw":["金融街","11人"],"views":[{"type":"当事者の声","who":"サウジアラビア主導の連合軍の報道官","role":"イエメンで戦う連合軍の広報","stance":"「卑劣なテロ」","text":"SNSへの投稿で、攻撃を卑劣なテロ攻撃だと非難し、当局が現場で調べを進めていると明らかにした。","media":"アルジャジーラ","url":"https://www.aljazeera.com/news/2026/11/24/saudi-led-coalition-condemns-terrorist-attack-on-tower-in-riyadh"},{"type":"当事者の声","who":"モハンマドバゲル・ガリバフ","role":"イラン国会議長","stance":"米国の回答待ち","text":"イランは自国の要求を米国側に伝えており、その回答を待っていると述べた。","media":"タス通信","url":"https://tass.com/world/2223805"}],"accent":"#ffd60a"},
{"cat":"world","loc":[31.23,121.47,"中国・上海"],"region":"アジア","title":"中国、上海トップの<span>陳吉寧氏</span>を調査","lead":"中国共産党の中央規律検査委員会は24日、政治局員で上海市のトップを務める陳吉寧氏を、重大な規律違反と法律違反の疑いで調べていると発表した。上海のトップは最高指導部への登竜門とされ、習近平国家主席の反腐敗運動が党の中枢に及んでいる。","src":{"name":"AP通信（ABCニュース掲載）","date":"11月24日","url":"https://abcnews.com/International/wireStory/china-investigates-politburo-member-shanghai-party-chief-chen-138407145"},"gist":"次の最高指導部の候補とも見られていた大物が、突然調べを受けることになった。党の上層部でも、引き締めが続いていることを示している。","detail":["ロイターによると、2022年に発足した24人の政治局から調査を受けるのは、2025年以降で4人目となる。","陳氏は62歳。清華大学の学長、環境保護相、北京市長を経て、2022年10月に上海市の党委員会書記に就いた。","上海市のトップは、習氏や李強首相もかつて務めたポストだ。"],"kw":["政治局","登竜門"],"views":[{"type":"専門家","who":"ジャン・クリストファー・ミッテルシュテット","role":"チューリッヒ大学の中国専門家","stance":"手綱は緩めない","text":"今回の調査は、反腐敗運動と党の「自己革命」に手を緩めないという合図であり、誰も安全ではないことを示していると述べた。","media":"ロイター（finwire掲載）","url":"https://finwire.io/news/world-news/china-investigates-politburo-star-in-xi-jinpings-latest-purge"}],"accent":"#ff6b1a"},
{"cat":"tech","loc":[40.96,100.29,"中国・酒泉衛星発射センター"],"region":"アジア","title":"中国の宇宙船に<span>パキスタン人</span>飛行士","lead":"中国は25日朝、有人宇宙船「神舟24号」を打ち上げ、宇宙ステーション「天宮」につなげた。乗員3人のうち1人はパキスタン人で、天宮に外国人が乗るのは初めてだ。","src":{"name":"CBSニュース（AP通信）","date":"11月24日","url":"https://www.cbsnews.com/news/china-launches-shenzhou-24-spacecraft/"},"gist":"これまで中国人だけが乗ってきた中国の宇宙ステーションに、初めて外国の飛行士が加わった。パキスタンにとっては、自国の人が初めて宇宙へ行く出来事になった。","detail":["打ち上げは北京時間の午前8時18分で、約3時間38分後に天宮とつながった。","パキスタン人のムハンマド・ジーシャン・アリ氏は40歳のパイロットで、約1週間とどまり、微細藻類やキヌアの種を使った実験などをする。","船長の湯洪波氏は、天宮に3回乗る初めての飛行士になる。"],"kw":["天宮","初めて"],"views":[{"type":"当事者の声","who":"シャバズ・シャリフ","role":"パキスタン首相","stance":"友好は宇宙へ","text":"パキスタンと中国の友好は、宇宙への旅でヒマラヤの高さを超えつつあるとSNSに投稿した。","media":"CBSニュース（AP通信）","url":"https://www.cbsnews.com/news/china-launches-shenzhou-24-spacecraft/"},{"type":"専門家","who":"ブレイン・クルシオ","role":"香港の宇宙産業コンサルティング会社オービタル・ゲートウェイの創業者","stance":"威信と技術","text":"今回の飛行はパキスタンに威信と科学技術のノウハウをもたらし、中国との協力関係を深めると述べた。","media":"コリア・ヘラルド（ロイター）","url":"https://www.koreaherald.com/article/10948946"}],"accent":"#2e7bff"},
{"cat":"world","loc":[31.52,34.45,"パレスチナ・ガザ市"],"region":"中東","title":"イスラエル空爆、<span>ハマス治安トップ</span>殺害","lead":"イスラエル軍は24日、ガザ市西部への空爆で、イスラム組織ハマスの内部治安機関の長ナイーム・アブ・ナヘル氏を殺害した。昨年10月の停戦のあとも、ガザでは攻撃による死者が続いている。","src":{"name":"BBC（ヤフーニュース掲載）","date":"11月24日","url":"https://www.yahoo.com/news/world/articles/israeli-air-strike-kills-hamas-121253345.html"},"gist":"停戦が結ばれたあとも、空爆による死者が出続けている。ハマスは、イスラエルが合意を壊そうとしていると非難している。","detail":["ロイターによると、この日はアブ・ナヘル氏を含む少なくとも7人が死亡し、ハンユニスの警察の詰め所への攻撃では警察官2人が死亡した。","アブ・ナヘル氏は50歳で、前任者がイスラエル軍の特殊部隊に捕らえられたあとの9月から、この職に就いていた。","ハマスが運営する保健省によると、昨年10月の停戦以降、ガザで少なくとも1679人が死亡した。"],"kw":["停戦","7人"],"views":[{"type":"当事者の声","who":"ネタニヤフ首相とカッツ国防相","role":"イスラエル政府","stance":"幹部を排除","text":"ハマスの内部治安機関のトップを排除したと発表した。軍と治安機関も、ハマスの幹部を攻撃したとする共同声明を出した。","media":"BBC（ヤフーニュース掲載）","url":"https://www.yahoo.com/news/world/articles/israeli-air-strike-kills-hamas-121253345.html"},{"type":"当事者の声","who":"ハマス","role":"パレスチナのイスラム組織（声明）","stance":"停戦は守る","text":"イスラエルの主張を否定し、停戦合意を守る立場だと述べたうえで、イスラエルが合意を壊そうとしていると非難した。","media":"RTE（ロイター）","url":"https://www.rte.ie/news/world/2026/1124/1600447-israel-gaza/"}],"accent":"#b6ff2e"},
{"cat":"world","loc":[38.9,-77.04,"米国・ワシントン"],"region":"北米","title":"米、日本など16か国・地域に<span>新関税</span>へ","lead":"トランプ政権は、日本や中国、EUなど16の国・地域を対象に、新たな関税を近く打ち出す見通しだと、ロイターが関係者の話として伝えた。2月に最高裁が無効とした関税を、別の法律で置き換えるねらいがある。","src":{"name":"コリア・タイムズ（ロイター）","date":"11月25日","url":"https://www.koreatimes.co.kr/world/20261125/us-poised-to-unveil-new-tariffs-targeting-s-korea-15-other-trading-partners"},"gist":"裁判で止められた関税を、別のやり方で復活させようとしている。日本の輸出企業にも影響が及ぶ可能性がある。","detail":["通商法301条にもとづく、過剰な生産能力をめぐる調査の結果として示される見込みで、税率はまだ明らかになっていない。","報道によると、日本、EU、韓国はこれまでの合意をふまえ、15%以下に抑えられる見通しだ。","中国商務省は24日、米国向けのガリウムなどの輸出禁止を止めている措置を、2027年1月27日まで延ばすと発表した。"],"kw":["16の国・地域","301条"],"views":[{"type":"当事者の声","who":"ジェイミソン・グリア","role":"米通商代表","stance":"手段は変わっても方針は同じ","text":"3月に調査を始めた際、裁判所の判断によって使う手段は変わりうるが、関税の方針そのものは変わらないと述べた。","media":"PBS（AP通信）","url":"https://www.pbs.org/newshour/politics/trump-administration-starts-new-process-to-try-to-replace-tariffs-struck-down-by-supreme-court"},{"type":"分析・データ","who":"ソウル経済新聞","role":"韓国の経済紙","stance":"韓国の15%は維持か","text":"WSJの報道を引き、韓国が2025年の合意で得た15%の上限は保たれる見通しだが、相手国が政策を変えなければさらに引き上げる余地も残されると伝えた。","media":"ソウル経済新聞","url":"https://en.sedaily.com/world/2026/11/24/us-overproduction-tariffs-may-land-this-week-with-korea"}],"accent":"#8b5cff"},
{"cat":"sports","loc":[14.69,-17.44,"セネガル・ダカール"],"region":"アフリカ","title":"アフリカ杯、<span>セネガル</span>の優勝が復活","lead":"スポーツ仲裁裁判所は24日、1月のアフリカ・ネーションズカップ決勝をめぐるセネガルの訴えを認め、取り消されていた優勝をセネガルに戻した。モロッコのサッカー連盟は抗議し、さらに法的な手段を取るとしている。","src":{"name":"ESPN（AP通信）","date":"11月24日","url":"https://www.espn.com/soccer/story/_/id/50582074/senegal-africa-cup-nations-morocco-cas"},"gist":"選手が試合の途中でいったんピッチを離れたことが没収負けにあたるかが争われ、裁判所はあたらないと判断した。","detail":["モロッコのラバトで行われた決勝では、セネガルの選手がモロッコに与えられたPKに抗議して約15分間試合を離れたが、再開後のPKは止められ、セネガルが延長の末に1対0で勝った。","仲裁裁判所は、没収負けの規定は試合が完全に打ち切られた場合にだけあてはまるとして、3月にアフリカサッカー連盟の上訴委員会がモロッコに優勝を与えた決定を覆した。","モロッコ側は、仲裁人の1人が裁定の約48時間前にセネガルの連盟会長と接触したと主張しているが、仲裁人は否定している。"],"kw":["没収負け","48時間前"],"views":[{"type":"当事者の声","who":"アブドゥライ・ファル","role":"セネガル・サッカー連盟会長","stance":"スポーツの正義","text":"裁定はスポーツに正義をもたらしたと述べ、前に進む用意があるとしてモロッコとの絆を改めて強調した。","media":"ザ・ナショナル","url":"https://www.thenationalnews.com/sport/football/2026/11/25/senegal-vs-morocco-afcon-verdict-cas-ruling-explained-and-what-happens-next/"},{"type":"当事者の声","who":"モロッコ王立サッカー連盟","role":"モロッコのサッカー協会（声明）","stance":"さらに法的措置へ","text":"裁定に抗議し、さらに法的な措置を取ると表明した。仲裁人とセネガルの連盟会長との接触を問題にしている。","media":"GBCガーナ","url":"https://www.gbcghanaonline.com/news/morocco-protest-cas-ruling-restoring-senegal-as-afcon-champions-vow-further-legal-action/2026/"}],"accent":"#19e3ff"},
{"cat":"tech","loc":[35.68,139.78,"東京・日本橋兜町"],"region":"日本","title":"日経平均、<span>一時2100円超</span>下落","lead":"25日の東京株式市場で日経平均株価は大きく下がり、下げ幅は一時2100円を超えた。前日の米国市場でAI向け半導体の株が売られた流れを受け、前日の大幅高から一転した。","src":{"name":"NHK","date":"11月25日","url":"https://news.web.nhk/newsweb/na/nd-20261125de80958"},"gist":"AIへの巨額の投資が本当にもうかるのかという不安が、また強まった。NVIDIAのトップ復帰で買われた勢いは、1日で消えた。","detail":["共同通信によると、午前の終値は5万6710円43銭で、前日より1934円20銭安かった。","24日の米国市場では、ナスダック総合指数が約1.5%下がり、半導体株への売りが目立った。","前日の24日は、2200円を超える値上がりだった。"],"kw":["2100円","半導体"],"views":[{"type":"分析・データ","who":"ANN（テレビ朝日系列）","role":"日本の報道機関","stance":"AI投資の不透明感","text":"AI投資の採算やデータセンターへの規制をめぐる不透明感が残り、フアン氏の復帰でいったん和らいだ不安は消えていないと伝えた。","media":"KSB瀬戸内海放送（ANN）","url":"https://news.ksb.co.jp/ann/article/17077345"},{"type":"分析・データ","who":"ソウル経済新聞","role":"韓国の経済紙","stance":"根本の問題は残る","text":"アジアのハイテク株安について、AIへの過剰な投資や、支出に見合わない収益への懸念といった根本的な問題は和らいでいないとのアナリストの見方を伝えた。","media":"ソウル経済新聞","url":"https://en.sedaily.com/world/2026/11/25/softbank-falls-10-percent-as-asian-tech-stocks-tumble-on"}],"accent":"#ff2e88"},
{"cat":"world","loc":[19.76,96.08,"ミャンマー・ネピドー"],"region":"アジア","title":"英、ミャンマー軍幹部5人に<span>制裁</span>","lead":"英国のミリバンド外相は23日、国際司法裁判所がミャンマーによるロヒンギャへのジェノサイドを認めたことを受け、国軍の幹部5人に制裁を科すと発表した。国家がジェノサイドの責任を問われたのは、同裁判所で初めてだ。","src":{"name":"dpa通信（ヤフーニュース掲載）","date":"11月23日","url":"https://www.yahoo.com/news/world/articles/uk-sanctions-myanmar-president-military-194837765.html"},"gist":"国際的な裁判所が、国家による集団殺害を初めて認めた。各国がそれにどう応えるかが問われるなか、英国はまず制裁で動いた。","detail":["国際司法裁判所は19日、9対6でミャンマーがジェノサイドを行ったと判断し、2028年11月までに賠償の計画を出すよう命じた。","英国は、航空燃料の輸出を止める法律を数か月のうちに整え、国連安全保障理事会でもこの問題を取り上げる。","ロヒンギャの生存者に300万ポンド、人道支援に500万ポンドを出すとした。"],"kw":["ジェノサイド","5人"],"views":[{"type":"専門家","who":"マリア・エレナ・ビニョーリ","role":"ヒューマン・ライツ・ウォッチの国際司法担当の上級法律顧問","stance":"長く待たれた認定","text":"判決は、ロヒンギャが受けてきた苦しみが長い時間を経てようやく認められたものだとし、ミャンマーに速やかに従うよう求めた。","media":"ヒューマン・ライツ・ウォッチ","url":"https://www.hrw.org/news/2026/11/19/world-court-finds-myanmar-committed-rohingya-genocide"},{"type":"当事者の声","who":"ウェンディ・モートン","role":"英保守党の影の外務担当閣外相","stance":"国際法の政治利用を警戒","text":"下院で残虐行為を非難しつつ、法の基準が政治の目的に従うようになってはならないと述べ、国際法の「武器化」に警戒を示した。","media":"LBC","url":"https://www.lbc.co.uk/article/uk-sanctions-myanmar-president-genocide-ruling-5HjdnRP_2/"}],"accent":"#ffd60a"},
{"cat":"world","loc":[-4.32,15.31,"コンゴ民主共和国・キンシャサ"],"region":"アフリカ","title":"コンゴ、<span>コバルト輸出</span>を再び停止","lead":"コンゴ民主共和国は24日、30日からすべてのコバルトの輸出を当面止めると発表した。世界の産出量の4分の3近くを占める国の決定で、電気自動車やスマートフォンの電池に使う金属の値動きに影響しそうだ。","src":{"name":"アフリカニュース（AFP通信）","date":"11月24日","url":"https://www.africanews.com/2026/11/24/dr-congo-halts-cobalt-exports-again-amid-drop-in-prices/"},"gist":"値下がりが続くコバルトの価格を支えるため、最大の産出国が出荷を止める。電池の材料を世界に送り出す国の決定だけに、市場への影響は大きい。","detail":["輸出の停止は2025年以来2回目。前回は10か月続き、その後は輸出量を割り当てる仕組みに移った。","規制当局は、年の半ばからの値下がりの理由に、世界の消費の鈍化や在庫の積み上がり、投機的な取引を挙げた。","鉱山相は、必要と判断するかぎり停止を続けると述べた。"],"kw":["4分の3","電気自動車"],"views":[{"type":"専門家","who":"オーウェン・シャオ","role":"上海有色網（SMM）のアナリスト","stance":"想定以上の衝撃","text":"市場は割り当ての20〜50%の削減を予想していたため、全面停止の衝撃は大きいとし、目先の値上がりと、2027年3〜6月の中国での供給のひっ迫を見込んだ。","media":"上海有色網（SMM）","url":"https://news.metal.com/newscontent/DB3YVMTKX7ZOHJXNC2OAMVV6N2O57BWM2AMHH4Y-smm-analysis-the-drc-is-halting-cobalt-exports-again-how-long-can-the-rally-last"}],"accent":"#ff6b1a"},
{"cat":"tech","loc":[48.26,11.67,"ドイツ・ガルヒング"],"region":"宇宙","title":"最も遠い<span>クエーサー</span>、記録を更新","lead":"ドイツの研究者らのチームは、欧州宇宙機関のユークリッド宇宙望遠鏡の観測から、これまでで最も遠いクエーサーを見つけた。宇宙が生まれて約6億3000万年後の姿で、記録を一気に約4000万年さかのぼらせた。","src":{"name":"KSAT（AP通信）","date":"11月24日","url":"https://www.ksat.com/news/world/2026/11/24/scientists-discover-quasar-formed-within-a-mere-630-million-years-of-the-big-bang-setting-a-record/"},"gist":"宇宙のごく初期に、すでに巨大なブラックホールが育っていたことを示す発見だ。","detail":["このクエーサーは131億年前の光で見えている。当時の宇宙は、いまの年齢の5%に満たなかった。","中心のブラックホールは、太陽の約3億6000万倍の重さがある。","アイルランドのアラン諸島にある先史時代の石の砦にちなみ、「ドゥン・エンガス」という愛称が付けられた。"],"kw":["6億3000万年","4000万年"],"views":[{"type":"専門家","who":"ジュリアン・ウルフ","role":"ヨーロッパ南天天文台の研究者（研究の筆頭）","stance":"大きな飛躍","text":"今回は宇宙の時間をさかのぼる幅がとても大きいと話し、記録は数か月で破られるかもしれないし、何年も残るかもしれないと述べた。","media":"KSAT（AP通信）","url":"https://www.ksat.com/news/world/2026/11/24/scientists-discover-quasar-formed-within-a-mere-630-million-years-of-the-big-bang-setting-a-record/"},{"type":"分析・データ","who":"テックタイムズ","role":"米国の科学技術ニュースサイト","stance":"早い時期に急成長","text":"ブラックホールが物質を取り込む速さは理論上の上限の12〜44%にとどまり、それでもこれほど重いのは、早い時期に急速に育ったことを示すと伝えた。","media":"テックタイムズ","url":"https://www.techtimes.com/articles/331465/20261124/most-distant-quasar-found-euclid-telescope-slow-feeding-black-hole-needed-rapid-early-growth.htm"}],"accent":"#2e7bff"},
{"cat":"world","loc":[12.42,39.56,"エチオピア・アラマタ"],"region":"アフリカ","title":"ティグライ砲撃、<span>戦争犯罪</span>の調査を","lead":"国際人権団体アムネスティ・インターナショナルは23日、エチオピア軍と政府側の民兵が9月にティグライ州南部のアラマタを3日間砲撃し、市民14人が死亡したとして、戦争犯罪として調べるよう求めた。2020〜22年の内戦が再び燃え上がるなかでの報告だ。","src":{"name":"アムネスティ・インターナショナル","date":"11月23日","url":"https://www.amnesty.org/en/latest/news/2026/11/ethiopia-lethal-artillery-strikes-on-civilian-neighbourhoods-in-tigrays-alamata-city-must-be-investigated-as-war-crimes/"},"gist":"政府軍による住宅地への攻撃で市民が犠牲になったと、人権団体が訴えた。国連に、独立した調査の仕組みをつくるよう求めている。","detail":["最も被害が大きかったのは9月27日の夜明けで、住宅5棟に砲弾が当たり、母親と8歳の息子を含む7人が死亡した。","アムネスティは28人から話を聞き、動画や写真、衛星画像を分析した。","政府軍側は9月28日にアラマタを、その1週間足らずのちに州都メケレを掌握した。"],"kw":["14人","3日間"],"views":[{"type":"当事者の声","who":"ヤスミン・アハメド","role":"アムネスティ・インターナショナルの地域人権担当上級ディレクター","stance":"国連に調査を要求","text":"エチオピア軍と民兵は8万人の住民の命をまったく顧みずに3日間砲撃したと述べ、国連人権理事会に独立した調査の仕組みを設けるよう求めた。","media":"タイムズライブ（ロイター）","url":"https://www.timeslive.co.za/news/world/2026-11-24-ethiopian-shelling-of-tigray-town-should-be-investigated-as-possible-war-crimes-amnesty-says/"}],"accent":"#b6ff2e"},
{"cat":"sports","loc":[41.95,-87.66,"米シカゴ・リグレー・フィールド"],"region":"北米","title":"佐藤輝明、カブスと<span>6年1億2千万ドル</span>","lead":"阪神タイガースの佐藤輝明選手が、米大リーグのカブスと6年総額1億2000万ドルの契約で合意したと、ESPNが24日に関係者の話として報じた。今季はセ・リーグで三冠王とMVPに輝いた強打者だ。","src":{"name":"ESPN","date":"11月24日","url":"https://www.espn.com/mlb/story/_/id/50583163/sources-cubs-teruaki-sato-reach-6-year-120m-deal"},"gist":"日本で今季の打撃の主要3部門を制した打者が、大リーグに挑む。カブスでは右翼の主力として期待されている。","detail":["今季は143試合で打率3割0分6厘、39本塁打、106打点だった。","ポスティングシステムで11月1日に交渉が解禁され、交渉できる期間は45日間だった。","課題は三振の多さで、今季は614打席で164三振を喫した。"],"kw":["三冠王","右翼"],"views":[{"type":"分析・データ","who":"ジェシー・ロジャース","role":"ESPNのカブス担当記者","stance":"打線は維持、投手が課題","text":"佐藤選手は右翼の穴を埋め、今季大リーグで最も多く得点した打線を上位に保つが、チームの最大の課題はなお投手陣だと分析した。","media":"ESPN","url":"https://www.espn.com/mlb/story/_/id/50583163/sources-cubs-teruaki-sato-reach-6-year-120m-deal"},{"type":"専門家","who":"エリック・サムルスキー","role":"NBCスポーツの野球アナリスト","stance":"選球眼が不安","text":"3番・右翼での起用を見込み、長打力は通用するとみる一方、ボール球に手を出す割合の高さを最大の不安に挙げた。","media":"NBCスポーツ","url":"https://www.nbcsports.com/mlb/news/cubs-agree-to-six-year-deal-with-japanese-slugger-teruaki-sato-where-he-fits-in-chicagos-2027-lineup"}],"accent":"#8b5cff"},
{"cat":"tech","loc":[47.64,-122.13,"米ワシントン州レドモンド"],"region":"北米","title":"マイクロソフト、大障害で<span>最高警戒</span>","lead":"マイクロソフトが、11月12〜13日に起きた約24時間の大規模障害を受け、社内で最も深刻な警戒態勢「コード・レッド」を宣言していたことがわかった。ロイターが24日、社内文書をもとに報じた。","src":{"name":"インベスティング・ドットコム（ロイター）","date":"11月24日","url":"https://www.investing.com/news/stock-market-news/exclusivemicrosoft-declares-code-red-after-historic-outage-internal-memos-show-5048702"},"gist":"世界中の役所や企業が使うメールや会議のサービスが丸1日止まり、会社は再発を防ぐことを最優先にした。","detail":["障害ではメールや会議のサービスが使いにくくなり、オーストラリアや日本から米国まで、各国の政府にも影響が出た。","原因は7月の修正で入り込んだWindowsの不具合で、最悪の時点ではサーバーの8割以上が応答しなくなった。","同社は、障害を1時間以内に世界中で解消できる体制をめざし、AIを使ってシステムの状態を診断する仕組みも取り入れる。"],"kw":["コード・レッド","8割以上"],"views":[{"type":"当事者の声","who":"ジェイソン・ヘンダーソン","role":"マイクロソフト365コア部門のプレジデント","stance":"最優先の仕事","text":"Exchange Onlineの歴史で最も顧客に影響した障害だとし、対策をチームの最優先の仕事に位置づけた。","media":"インベスティング・ドットコム（ロイター）","url":"https://www.investing.com/news/stock-market-news/exclusivemicrosoft-declares-code-red-after-historic-outage-internal-memos-show-5048702"},{"type":"専門家","who":"ワシーム・アーメド","role":"セキュリティー企業Secure.comの技術責任者","stance":"速さは両刃","text":"1時間で修正を届けられる仕組みは、1時間で誤りも広げうると指摘し、地域ごとに通信を分ける対策に注目すべきだと述べた。","media":"シリコンアングル","url":"https://siliconangle.com/2026/11/24/microsoft-declares-internal-code-red-after-nearly-24-hour-microsoft-365-outage/"}],"accent":"#19e3ff"},
{"cat":"world","loc":[-6.18,106.35,"インドネシア・バンテン州チカンデ"],"region":"アジア","title":"インドネシア菓子工場火災、<span>26人</span>死亡","lead":"インドネシアの首都ジャカルタに近いバンテン州の菓子工場で起きた火災で、24日までに従業員26人の死亡が確認された。警察は、過失の疑いで刑事捜査を始めた。","src":{"name":"WMUR（AP通信）","date":"11月24日","url":"https://www.wmur.com/article/most-victims-indonesia-factory-fire-died-emergency-exit/74518826"},"gist":"多くの人が働く工場で、逃げ遅れた従業員が犠牲になった。安全対策が十分だったかが問われている。","detail":["火災は21日夜に起き、3階建ての工場の2階にある冷却装置から火が出た可能性がある。工場の中には約300人がいた。","犠牲者の多くは2階の非常階段へ向かう通路の近くで見つかり、従業員は警報が鳴らなかったと話している。","工場はミルク味のあめ「ミルキタ」をつくる会社のもので、製品は40か国以上に輸出されている。"],"kw":["26人","非常階段"],"views":[{"type":"当事者の声","who":"スティーブン・エルウィン・ウィジャヤ","role":"工場を運営するフォヌサ・アグン・ムリア社のCEO","stance":"責任を持って支援","text":"被害者と家族の支援に責任を持って取り組むと述べ、定期的に避難訓練を行い、消火栓や出口は機能していたと説明した。","media":"WMUR（AP通信）","url":"https://www.wmur.com/article/most-victims-indonesia-factory-fire-died-emergency-exit/74518826"}],"accent":"#ff2e88"},

const KATA = /^[\u30A1-\u30FC]+$/, KCH = /[\u30A1-\u30FA\u30FC]/;
const GTERMS = Object.keys(GLOSS).sort((a, b) => b.length - a.length);
/* 長い登録語の一部になっている箇所では、短い語を当てない（「韓国総合株価指数」の中の「韓国」など） */
const GSUPER = Object.fromEntries(GTERMS.map(t => [t, GTERMS.filter(k => k !== t && k.includes(t)).map(esc)]));
const inLonger = (html, i, t, e) => GSUPER[t].some(ek => { for (let o = ek.indexOf(e); o > -1; o = ek.indexOf(e, o + 1)) if (i - o >= 0 && html.startsWith(ek, i - o)) return true; return false; });
const gloss = (html, used) => {
  for (const t of GTERMS){
    if (used.has(t)) continue;
    const e = esc(t); let i = html.indexOf(e);
    while (i > -1){
      const inTag = html.lastIndexOf("<", i) > html.lastIndexOf(">", i);
      const inBtn = html.lastIndexOf("<a class=\"g\"", i) > html.lastIndexOf("</a>", i);
      const kataBad = KATA.test(t) && (KCH.test(html[i - 1] || "") || KCH.test(html[i + e.length] || ""));
      if (!inTag && !inBtn && !kataBad && !inLonger(html, i, t, e)) break;
      i = html.indexOf(e, i + 1);
    }
    if (i < 0) continue;
    used.add(t);
    html = html.slice(0, i) + `<a class="g" role="button" tabindex="0" data-g="${e}" aria-expanded="false">${e}</a>` + html.slice(i + e.length);
  }
  return html;
};

function panes(n, no){

  n.views.forEach((v, k) => P.push(`<div class="pane"><div class="in"><div class="tags"><span class="tag w">${v.type === "専門家" ? "専門家の見解" : esc(v.type)} ${k+1} / ${n.views.length}</span><span class="tag o">${esc(v.stance)}</span></div>

/* 見出しの改行：文節（助詞・句読点のあと）でまとまりを作り、その途中では改行しない */
const PHRASE = /([^、。！？」）]*?(?:から|まで|より|とは|では|には|へは|は|が|を|に|で|と|の|へ|も|や|、|。|！|？|」|）)(?=[^ぁ-んー、。！？」）]|$)|[^、。！？」）]+$)/g;
/* 長すぎる文節（7字以上）は、さらに自然な切れ目で分ける。1行に入らない文節が丸ごと次の行へ送られ、
   「米、」だけが1行目に残るような改行を防ぐ。切れ目：「など」「ほか」「・」の後／漢字・カタカナに付いた助詞のあとにひらがなが続くところ／数字の前（「1億2千万」の途中は除く）／カタカナと漢字の境目（「フアン氏」「千万ドル」のような短い付属語は切らない） */
const SUBCUT = /(?<=など|ほか|・)|(?<=[一-龯々ァ-ヴー][がはにで]|を)(?=[ぁ-ん]{3}|[ぁ-ん]{2}[一-龯々])|(?<=[ぁ-ん])(?=[ァ-ヴ][ァ-ヴー]{2})|(?<=[^\d０-９.,，億万千百十兆約第])(?=[\d０-９])|(?<=[ァ-ヴー]{2}[人氏系派産製軍州省党側]?)(?=[一-龯々]{2})|(?<=[一-龯々]{2})(?<![億万千百十兆])(?=[ァ-ヴー]{3})/;
const splitLong = p => {
  if (p.length < 7) return [p];
  const out = [];
  for (const x of p.split(SUBCUT).filter(Boolean)){
    if (out.length && (x.length < 2 || out[out.length - 1].length < 2)) out[out.length - 1] += x;   // 1字だけのかけらは前とつなぐ
    else out.push(x);
  }
  return out;
};
const phrase = el => {
  const runs = [...el.childNodes].map(n => [n.textContent, n.nodeType === 1]);
  const text = runs.map(r => r[0]).join("");
  const parts = text.split(/(?=「|（)/).flatMap(x => x.match(PHRASE) || [x]).filter(Boolean)
    .reduce((a, x) => { if (a.length && /^(最も|最)$/.test(a[a.length - 1])) a[a.length - 1] += x; else a.push(x); return a; }, [])   // 「最も」は次とつなぐ
    .flatMap(splitLong);
  if (parts.join("") !== text) return;
  const acc = []; for (const [t, a] of runs) for (const _ of t) acc.push(a);
  el.textContent = ""; let k = 0;
  for (const x of parts){
    const ph = document.createElement("span"); ph.className = "ph";
    let buf = "", cur = acc[k];
    const flush = () => { if (!buf) return; if (cur){ const a = document.createElement("span"); a.textContent = buf; ph.appendChild(a); } else ph.appendChild(document.createTextNode(buf)); buf = ""; };
    for (const ch of x){ if (acc[k] !== cur){ flush(); cur = acc[k]; } buf += ch; k++; }
    flush(); el.appendChild(ph);
  }
};
/* アプリとして（ホーム画面から）開いているか */
const STANDALONE = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
/* 見出しを少し（最大8%）小さくすれば1行減るなら、小さくする。
   例：「NVIDIA、辞任した／フアン氏を／CEOに戻す」の3行を、2行に収める */
const headLines = h => Math.round(h.getBoundingClientRect().height / parseFloat(getComputedStyle(h).lineHeight));
const fitHeads = () => {
  feed.querySelectorAll(".card:not(.end) .pane:first-child h2").forEach(h => {

    if (n < 3) return;
    for (let f = 0.98; f >= 0.919; f -= 0.02){

};
let fitT = 0;
addEventListener("resize", () => { clearTimeout(fitT); fitT = setTimeout(fitHeads, 150); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitHeads);
function render(){

function setCur(k){

const go = k => feed.children[k]?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
const side = d => { const t = feed.children[cur]?.querySelector(".track"); if (t) t.scrollBy({left: d * t.clientWidth, behavior:"smooth"}); };

feed.addEventListener("click", e => {
  const l = e.target.closest(".like");
  if (l){ const k = l.dataset.key; liked.has(k) ? liked.delete(k) : liked.add(k); l.setAttribute("aria-pressed", liked.has(k)); store.set("dpg-liked", [...liked]); return; }
  const j = e.target.closest("[data-jump]");
  if (j){ if (cat !== "all"){ cat = "all"; render(); } go(ORDER.indexOf(+j.dataset.jump)); }
});
$("#next").addEventListener("click", () => go(cur >= feed.children.length - 1 ? 0 : cur + 1));
$("#how").addEventListener("click", () => { go(feed.children.length - 1); setTimeout(() => { const t = $("#end .track"); if (t) t.scrollTo({left: t.clientWidth, behavior:"smooth"}); }, 450); });
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea")) return;
  if (!document.getElementById("sheet").hidden || !document.getElementById("shareSheet").hidden || !document.getElementById("appSheet").hidden) return;
  if (e.key === "ArrowDown"){ e.preventDefault(); go(Math.min(cur + 1, feed.children.length - 1)); }
  if (e.key === "ArrowUp"){ e.preventDefault(); go(Math.max(cur - 1, 0)); }
  if (e.key === "ArrowRight"){ e.preventDefault(); side(1); }
  if (e.key === "ArrowLeft"){ e.preventDefault(); side(-1); }

}, true);
$("#shArt").onclick = () => { const n = NEWS[ORDER[shareNo - 1]]; closeShare(); shareTo(n ? plain(n.title) + "｜DOPE" : SITE_TITLE, artUrl(shareNo), "この記事のリンクをコピーしました"); };
$("#shSite").onclick = () => { closeShare(); shareTo(SITE_TITLE, SITE_URL, "DOPEのリンクをコピーしました"); };
$("#shCopy").onclick = () => { closeShare(); copyLink(artUrl(shareNo), "この記事のリンクをコピーしました"); };
$("#shX").onclick = closeShare;
ssheet.addEventListener("click", e => { if (e.target === ssheet) closeShare(); });
ssheet.addEventListener("keydown", e => {
  if (e.key === "Escape"){ e.stopPropagation(); closeShare(); return; }
  if (e.key !== "Tab") return;
  const f = [...ssheet.querySelectorAll("button")]; const i = f.indexOf(document.activeElement);
  if (e.shiftKey && i <= 0){ e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && i === f.length - 1){ e.preventDefault(); f[0].focus(); }
});
{ /* 下へスワイプで閉じる */
  const sp = ssheet.querySelector(".panel"); let sy = null;
  sp.addEventListener("touchstart", e => { sy = e.touches[0].clientY; }, {passive:true});
  sp.addEventListener("touchmove", e => { if (sy !== null && e.touches[0].clientY - sy > 60){ sy = null; closeShare(); } }, {passive:true});
}
/* ホーム画面に追加（アプリとして使う）。Android等はブラウザの追加画面を出し、iPhoneは手順を案内する */
let installEvt = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
const asheet = $("#appSheet"); let appLast = null;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const openAppSheet = () => {
  closePop(); appLast = document.activeElement;
  $("#appSteps").innerHTML = isIOS
    ? '<li>画面下（または上）の<b>共有ボタン</b>（四角から上向きの矢印）を押す</li><li>メニューを下へたどって<b>「ホーム画面に追加」</b>を押す</li><li>右上の<b>「追加」</b>を押すと、ホーム画面にDOPEのアイコンが出ます</li>'
    : '<li>ブラウザの<b>メニュー</b>（︙ や … のボタン）を開く</li><li><b>「ホーム画面に追加」</b>または<b>「アプリをインストール」</b>を押す</li><li>確認が出たら<b>「追加」</b>（または「インストール」）を押す</li>';
  asheet.hidden = false; $("#appX").focus({preventScroll:true});
};
const closeAppSheet = () => { if (asheet.hidden) return; asheet.hidden = true; if (appLast && appLast.focus) appLast.focus({preventScroll:true}); };
feed.addEventListener("click", async e => {
  if (!e.target.closest("[data-install]")) return;
  e.stopPropagation();
  if (installEvt){ try { await installEvt.prompt(); await installEvt.userChoice; installEvt = null; return; } catch (err) { installEvt = null; } }
  openAppSheet();
}, true);
$("#appX").onclick = closeAppSheet;
asheet.addEventListener("click", e => { if (e.target === asheet) closeAppSheet(); });
asheet.addEventListener("keydown", e => { if (e.key === "Escape"){ e.stopPropagation(); closeAppSheet(); } });
/* オフライン対応（https のときだけ） */
if ("serviceWorker" in navigator && location.protocol === "https:") addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));

const openFromHash = h => {
  const m = /^#n(\d{2})$/.exec(typeof h === "string" ? h : location.hash); if (!m) return;
  const idx = ORDER[+m[1] - 1]; if (idx === undefined) return;
  if (cat !== "all"){ cat = "all"; render(); }
  const k = list.indexOf(idx); if (k > -1) feed.children[k].scrollIntoView({behavior:"auto"});
};
addEventListener("hashchange", openFromHash);

/* 縦スクロールの引っかかり対策：中身がはみ出すパネルだけ内側でスクロールさせる */
const markTall = () => feed.querySelectorAll(".pane").forEach(p => p.classList.toggle("tall", p.scrollHeight > p.clientHeight + 4));
addEventListener("resize", () => requestAnimationFrame(markTall));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(markTall);

/* 半透明の上下バー：高さを測って、カードの中身がバーに隠れないようにする */
const barSize = () => { const r = document.documentElement.style; r.setProperty("--hh", document.querySelector("header").offsetHeight + "px"); r.setProperty("--fh", document.querySelector("footer").offsetHeight + "px"); };
barSize(); addEventListener("resize", barSize);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { barSize(); markTall(); });

/* 過去号：アーカイブ内のページでは「最新号へ」を出し、リンク先をそろえる */
if (ARCHIVED){ const l = $("#latest"); l.href = ROOT; l.hidden = false; }
const fixBackno = () => feed.querySelectorAll(".backno").forEach(a => a.href = ROOT + "archive/");

/* 号えらび：上の日付を押すと、保存されている号へすぐ移れる。号の目録は archive/days.json（tools/publish_day.py が作る） */
const sheet = $("#sheet"), dateBtn = $("#dateBtn"), strip = $("#strip");
$("#sheetAll").href = ROOT + "archive/";
let daysP = null, lastFocus = null;
const loadDays = () => daysP || (daysP = fetch(ROOT + "archive/days.json", {cache:"no-cache"})
  .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
  .catch(e => { daysP = null; throw e; }));
const paintDays = days => {
  if (!Array.isArray(days) || !days.length){ strip.innerHTML = '<p class="snote">まだ保存された号がありません。</p>'; return; }
  strip.innerHTML = days.map((d, i) => {
    const [, m, dd] = d.date.split("-"), here = d.date === DAY;
    const href = i === 0 ? ROOT : ROOT + "archive/" + d.date + "/";
    const badges = (i === 0 ? '<i>最新</i>' : "") + (here ? '<i class="now">表示中</i>' : "");
    return `<a class="day${here ? " here" : ""}" href="${esc(href)}"${here ? ' aria-current="page"' : ""}>
      <span class="dtop"><b>${+m}.${+dd}</b><small>${esc(d.wd)}曜</small></span><span class="badges">${badges}</span>
      <span class="dn">${+d.n}本</span><span class="dt">${esc(d.top || "")}</span></a>`;
  }).join("");
  const h = strip.querySelector(".here"); if (h) strip.scrollLeft = h.offsetLeft - 16;
};
const sheetFocus = () => [...sheet.querySelectorAll("a[href],button")];
const openSheet = () => {
  closePop(); lastFocus = document.activeElement;
  sheet.hidden = false; dateBtn.setAttribute("aria-expanded", "true");
  strip.innerHTML = '<p class="snote">読み込み中…</p>'; $("#sheetX").focus();
  loadDays().then(paintDays).catch(() => { strip.innerHTML = `<p class="snote">号の一覧を読み込めませんでした。<a href="${esc(ROOT + "archive/")}">過去の号の一覧</a>から選んでください。</p>`; })
    .finally(() => { if (!sheet.hidden){ const t = strip.querySelector(".here") || strip.querySelector(".day"); if (t) t.focus({preventScroll:true}); } });
};
const closeSheet = () => { if (sheet.hidden) return; sheet.hidden = true; dateBtn.setAttribute("aria-expanded", "false"); if (lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true}); };
dateBtn.addEventListener("click", () => sheet.hidden ? openSheet() : closeSheet());
$("#sheetX").addEventListener("click", closeSheet);
sheet.addEventListener("click", e => {
  if (e.target === sheet){ closeSheet(); return; }
  if (e.target.closest(".day.here")){ e.preventDefault(); closeSheet(); }
});
sheet.addEventListener("keydown", e => {
  if (e.key === "Escape"){ e.stopPropagation(); closeSheet(); return; }
  if (e.key !== "Tab") return;
  const f = sheetFocus(); if (!f.length) return;
  const i = f.indexOf(document.activeElement);
  if (e.shiftKey && i <= 0){ e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && i === f.length - 1){ e.preventDefault(); f[0].focus(); }
});
render();
openFromHash(START_HASH);
fixBackno();
markTall();
}
</script>
</body>
</html>
