{
const START_HASH = location.hash;
/* ===== 今日号の記事データ（2026年11月25日号・24時間版）=====
   作業メモ：エストニア国境とタキソールの記事は11月23日の発表を含むため、対象期間を23日からとした。見解が1件のみの記事は、別媒体で確認できた見解がほかになかったもの。 */
const ISSUE = {date:"2026.11.25 WED", range:"11月23〜25日"};

{"cat":"world","loc":[35.67,139.74,"東京・首相官邸"],"region":"アジア","accent":"#ff6b1a","title":"日本、ICC分担金を<span>前倒し</span>で全額支払いへ","lead":"高市首相は24日、ICCの赤根智子所長と会い、2027年分の分担金を年内に全額払うと伝えた。米国の制裁が本格化する前に、裁判所の資金を確保する狙いがある。","src":{"name":"ロイター（Daily Maverick掲載）","date":"11月24日","url":"https://www.dailymaverick.co.za/article/2026-11-24-japan-accelerates-icc-funding-as-us-sanctions-threaten-court/"},"gist":"米国の制裁で運営が苦しくなる国際的な裁判所を、最大の資金の出し手である日本が支える形になる。","detail":["通常は翌年4月以降に払う分担金を、12月末までに納める。赤根所長は、制裁が2027年4月に全面的に効く前に資金を受け取りたいと求めていた。","日本は2026年に約46億円を拠出し、ICC予算のほぼ15%を担う最大の拠出国だ。","米国のルビオ国務長官は10月9日、ICCそのものを制裁の対象にした。それ以前にも裁判官や検察官が制裁を受けていた。"],"kw":["分担金","制裁"],"views":[{"type":"当事者の声","who":"赤根智子","role":"国際刑事裁判所（ICC）所長","stance":"感謝と支援継続の要請","text":"非常に感謝していると述べ、資金を賢く使って裁判所を存続させ、職員の給与を払うと語った。日本に、地域と世界のリーダーとして支援を続けるよう求めた。","media":"AP通信（KCRA掲載）","url":"https://www.kcra.com/article/icc-president-japan-early-2027-payment-us-sanctions/74517801"},{"type":"当事者の声","who":"アントニオ・グテーレス","role":"国連事務総長","stance":"制裁は深刻な打撃","text":"10月9日に報道官を通じ、米国の制裁は、ICCを柱とする国際刑事司法の取り組みにとって深刻な打撃だと述べた。","media":"国連ニュース","url":"https://news.un.org/en/story/2026/10/1168562"}]},
{"cat":"tech","loc":[49.4,8.72,"ハイデルベルク"],"region":"宇宙","accent":"#2e7bff","title":"観測史上<span>最も遠い</span>クエーサーを発見","lead":"欧州の宇宙望遠鏡ユークリッドが、これまでで最も遠いクエーサーを見つけた。宇宙誕生から約6億3000万年後の姿で、巨大ブラックホールがなぜこれほど早く育ったのかという謎を深めている。","src":{"name":"マックス・プランク天文学研究所","date":"11月24日","url":"https://www.mpia.de/news/science/2026-10-dun-aonghasa"},"gist":"生まれて間もない宇宙に、すでに太陽の3億6000万倍も重いブラックホールがあった。どうやってそこまで速く育ったのか、今の理論では説明しきれない。","detail":["赤方偏移は8.13で、この値が8を超えるクエーサーが見つかったのは初めて。宇宙が今の5%に満たない年齢だった頃の光だ。","中心のブラックホールは太陽の約3億6000万倍の重さがある。","アイルランドの断崖に残る古代の砦にちなみ「ドゥーン・エンガス」と名付けられた。距離の確定には大型双眼望遠鏡とジェームズ・ウェッブ宇宙望遠鏡を使った。"],"kw":["クエーサー","ブラックホール"],"views":[{"type":"専門家","who":"シルビア・ベラディッタ","role":"マックス・プランク天文学研究所、イタリア国立天体物理学研究所（論文共著者）","stance":"さらに遠くにも","text":"これは私たちが見た中で最も遠いクエーサーだが、存在する中で最も遠いとは限らないと述べた。初期の宇宙でブラックホールがこれほど速く巨大になれた仕組みについて、理解を揺さぶる発見だとした。","media":"ロイター（TimesLIVE掲載）","url":"https://www.timeslive.co.za/news/sci-tech/2026-11-24-astronomers-find-oldest-known-quasar-from-the-early-universe/"},{"type":"専門家","who":"ジュリアン・ウルフ","role":"論文の筆頭著者、マックス・プランク天文学研究所（現・欧州南天天文台）","stance":"成長の速さが鍵","text":"ビッグバンに近い時代で見つかるほど、そのブラックホールは速く成長したことになると述べた。","media":"マックス・プランク天文学研究所","url":"https://www.mpia.de/news/science/2026-10-dun-aonghasa"}]},
{"cat":"world","loc":[31.52,34.45,"ガザ市"],"region":"中東","accent":"#b6ff2e","title":"イスラエル空爆、ハマス<span>治安機関トップ</span>殺害","lead":"イスラエル軍は24日、ガザ市への空爆でイスラム組織ハマスの内部治安機関トップを殺害した。2025年10月の停戦後も、ガザでは攻撃がほぼ毎日続いている。","src":{"name":"BBC（Yahoo掲載）","date":"11月24日","url":"https://www.yahoo.com/news/world/articles/israeli-air-strike-kills-hamas-121253345.html"},"gist":"停戦は形のうえでは続いているが、空爆と死者は止まっていない。イスラエルはハマスに組織を立て直させない構えだ。","detail":["殺害されたアブ・ナヘル氏は9月から内部治安機関を率いていた。前任者はイスラエル軍に拘束されていた。","ハンユニス西部の警察施設などへの攻撃もあり、AFP通信によるとこの日のガザでの死者は計7人に上った。","停戦以降、ガザでは1600人以上が死亡したと伝えられている。"],"kw":["内部治安機関","ハンユニス"],"views":[{"type":"当事者の声","who":"イスラエル軍・シンベト","role":"共同声明","stance":"停戦違反と主張","text":"アブ・ナヘル氏は停戦に組織的に違反しながら攻撃計画を進め、ハマスの能力を立て直そうとしていたとし、殺害は組織の運営に打撃を与えると述べた。","media":"The Times of Israel","url":"https://www.timesofisrael.com/israel-kills-hamas-security-chief-in-gaza-city-weeks-after-capturing-predecessor/"},{"type":"当事者の声","who":"ガザ内務省","role":"ハマスが運営する当局","stance":"混乱を狙うと非難","text":"殺害を暗殺だと非難し、イスラエルはガザで混乱と治安の崩壊を引き起こそうとしていると主張した。","media":"BBC（Yahoo掲載）","url":"https://www.yahoo.com/news/world/articles/israeli-air-strike-kills-hamas-121253345.html"}]},
{"cat":"tech","loc":[35.68,139.77,"東京"],"region":"アジア","accent":"#8b5cff","title":"日経平均<span>2207円高</span>、AI半導体に買い戻し","lead":"24日の東京市場で日経平均株価は2207円高の5万8644円となり、韓国総合株価指数も6%余り上がった。前日の米国市場で半導体大手エヌビディアの株価が急騰した流れを受けた。","src":{"name":"日本経済新聞","date":"11月24日","url":"https://www.nikkei.com/article/DGXZQOFL244L90U6A121C2000000/"},"gist":"AIへの投資は行き過ぎではとの不安で売られていた半導体株が、米国での急反発をきっかけに大きく買い戻された。","detail":["エヌビディアの株価は23日、ジェンスン・フアン氏のCEO復帰が発表されて31%余り上がった。","韓国総合株価指数は6.32%上がって5006となり、5000台を回復した。サムスン電子とSKハイニックスもそろって6%余り上昇した。","東京市場ではキオクシアが約10%、ソフトバンクグループが約4.7%上がった。"],"kw":["エヌビディア","キオクシア"],"views":[{"type":"専門家","who":"アントワン・チカイバン","role":"ニュー・ストリート・リサーチのアナリスト","stance":"まだ割安","text":"2028年に1株利益が約25ドルと見込まれることから、株価は利益の10倍に満たない水準だとし、上昇の余地は大きいとしてエヌビディア株の買い推奨を維持した。","media":"Yahoo Finance","url":"https://finance.yahoo.com/markets/stocks/article/nvidia-stock-falls-after-epic-rally-on-jensen-huangs-return-as-ceo-094535877.html"},{"type":"分析・データ","who":"ファイナンシャル・ニュース","role":"韓国の経済紙","stance":"反発の背景","text":"エヌビディアの急騰にマイクロンやTSMCの上昇が加わり、AI投資への不安で売られた後の買い戻しが韓国の半導体株を押し上げたと分析した。","media":"Financial News（韓国）","url":"https://en.fnnews.com/news/202611240804444470"}]},
{"cat":"sports","loc":[46.52,6.63,"ローザンヌ"],"region":"アフリカ","accent":"#19e3ff","title":"アフリカ杯の優勝、<span>セネガル</span>に戻る","lead":"スポーツ仲裁裁判所は24日、1月のアフリカ・ネーションズカップ決勝でモロッコに優勝を与えた決定を取り消した。セネガルの1-0の勝利が復活し、大陸王者が裁定で入れ替わった。","src":{"name":"AP通信（KSAT掲載）","date":"11月24日","url":"https://www.ksat.com/sports/2026/11/24/africa-cup-title-given-back-to-senegal-after-sports-court-rules-against-morocco/"},"gist":"試合を続けるか止めるかを決めるのは主審で、主審は試合を再開させた。だから途中で選手が退いたことを理由に負けにはできない、という判断だ。","detail":["決勝の終了間際、モロッコにPKが与えられると、セネガルの選手の多くが一時ピッチを離れ、試合は約15分中断した。","アフリカサッカー連盟の上訴委員会は3月、セネガルを敗戦扱いとしてモロッコの3-0勝利とし、優勝を移していた。","モロッコのサッカー連盟は、スイス連邦最高裁への訴えを含むあらゆる法的手段をとると表明した。"],"kw":["スポーツ仲裁裁判所","アフリカサッカー連盟"],"views":[{"type":"当事者の声","who":"アブドゥライ・ファル","role":"セネガルサッカー連盟会長","stance":"正義がなされた","text":"スポーツ仲裁裁判所はスポーツに正義をもたらしたと述べた。","media":"AP通信（KSAT掲載）","url":"https://www.ksat.com/sports/2026/11/24/africa-cup-title-given-back-to-senegal-after-sports-court-rules-against-morocco/"},{"type":"分析・データ","who":"グラフィック・オンライン","role":"ガーナの報道機関","stance":"主審の権限が決め手","text":"裁定の決め手は、ピッチ上の判断には原則として立ち入らないという考え方だったと解説した。主審が再開を決め、試合が打ち切られなかった以上、敗戦扱いの規定は当てはまらないとした。","media":"Graphic Online","url":"https://www.graphic.com.gh/sports/sports-news/field-of-play-doctrine-why-cas-ruled-in-favour-of-senegal.html"}]},
{"cat":"world","loc":[37.5,130.86,"鬱陵島"],"region":"アジア","accent":"#ff2e88","title":"ロシア軍機、韓国の<span>防空識別圏</span>に進入","lead":"韓国軍の合同参謀本部は24日、ロシアの軍用機が日本海上空の韓国の防空識別圏に入ったと明らかにした。近くの鬱陵島では、住民に地下への避難を求める警報が一時出された。","src":{"name":"コリア・タイムズ（聯合ニュース）","date":"11月24日","url":"https://www.koreatimes.co.kr/southkorea/defense/20261124/s-korea-briefly-issues-alert-on-eastern-island-after-russian-airplanes-enter-air-defense-zone"},"gist":"領空侵犯ではなかったが、韓国は戦闘機を緊急発進させて警戒した。島には誤った内容の警報が流れ、住民が戸惑った。","detail":["ロシア機は約20分とどまり、韓国軍がF15K戦闘機を出すと日本の方向へ向かい、その後北へ去った。","行政安全省の警報は領空が侵犯されたと誤って伝え、慶尚北道も当初は北朝鮮機の疑いと伝えて約40分後に訂正した。","韓国国防省はロシアの駐在武官を呼んで抗議した。ロシア機の進入は1週間前の17日にもあった。"],"kw":["防空識別圏","鬱陵島"],"views":[{"type":"当事者の声","who":"駐韓ロシア大使館","role":"ロシアの在外公館（タス通信を通じた説明）","stance":"国際法違反はない","text":"飛行は国際法に違反しておらず、韓国の防空識別圏は一方的に設定されたものだと主張した。","media":"コリア・タイムズ","url":"https://www.koreatimes.co.kr/southkorea/defense/20261124/s-korea-briefly-issues-alert-on-eastern-island-after-russian-airplanes-enter-air-defense-zone"}]},
{"cat":"tech","loc":[35.64,139.45,"東京都多摩市"],"region":"アジア","accent":"#ffd60a","title":"京王、最大約<span>1100万人分</span>の情報漏えいか","lead":"京王電鉄は24日、9月に受けたランサムウェア攻撃で、顧客や取引先など最大約1100万人分の個人情報が漏れたおそれがあると発表した。旅券の写しやクレジットカード番号も含まれる。","src":{"name":"NHK","date":"11月24日","url":"https://news.web.nhk/newsweb/na/nd-20261124de80663"},"gist":"鉄道会社グループのホテルや百貨店などの顧客情報が、まとめて盗まれた可能性がある。今のところ不正利用は確認されていないが、なりすましの詐欺に注意が要る。","detail":["漏えいのおそれがあるのは顧客や取引先が約1063万人で、ほかに応募者や従業員なども含まれる。重複があるため単純には足せない。","グループのホテルに泊まった外国人客の旅券の写しが約160万件、京王百貨店のカード番号が約2万件含まれる。","同じ24日、楽天証券も約441万件の氏名や住所などが外部に漏れたと公表した。"],"kw":["ランサムウェア","楽天証券"],"views":[{"type":"当事者の声","who":"京王電鉄","role":"発表資料","stance":"二次被害は未確認","text":"現時点で金銭被害や不正利用などの二次被害は確認されていないとした。個人情報保護委員会に確報を出し、対象者には個別に知らせるという。","media":"EnterpriseZine","url":"https://enterprisezine.jp/news/detail/25561"}]},
{"cat":"world","loc":[12.42,39.56,"アラマタ"],"region":"アフリカ","accent":"#ff6b1a","title":"ティグライ砲撃、<span>戦争犯罪</span>の調査を要求","lead":"国際人権団体アムネスティ・インターナショナルは、エチオピア北部のティグライ州アラマタで9月、軍などが住宅街を砲撃し市民14人が死亡したと発表した。戦争犯罪として調べるべきだとしている。","src":{"name":"ロイター（TimesLIVE掲載）","date":"11月24日","url":"https://www.timeslive.co.za/news/world/2026-11-24-ethiopian-shelling-of-tigray-town-should-be-investigated-as-possible-war-crimes-amnesty-says/"},"gist":"2022年に終わったはずの内戦が、9月に再び火を噴いた。人が住む街に砲弾が撃ち込まれ、市民が巻き込まれている。","detail":["アムネスティは、エチオピア国防軍と政府寄りの民兵組織が9月26〜28日に砲撃したとし、28人への聞き取りや映像、衛星画像で確かめた。","ティグライ人民解放戦線についても、住宅地や学校に拠点を置いて市民を危険にさらしたと批判した。同戦線は指摘を否定している。","政府側の部隊はアラマタを押さえた後、州都メケレも掌握した。"],"kw":["アラマタ","ティグライ人民解放戦線"],"views":[{"type":"当事者の声","who":"ヤスミン・アーメド","role":"アムネスティ・インターナショナル上級ディレクター","stance":"国連に調査を要求","text":"砲撃は人口8万人の街の人命を全く顧みないものだと述べた。処罰を免れてきたことが重大な違反を続けさせているとして、国連人権理事会に独立した調査の仕組みをつくるよう求めた。","media":"アムネスティ・インターナショナル","url":"https://www.amnesty.org/en/latest/news/2026/11/ethiopia-lethal-artillery-strikes-on-civilian-neighbourhoods-in-tigrays-alamata-city-must-be-investigated-as-war-crimes/"},{"type":"当事者の声","who":"ティグライ平和部隊の報道官","role":"政府寄りの民兵組織","stance":"前線にいなかった","text":"アラマタの戦闘の際、自らの戦闘員は前線にいなかったとロイター通信に語った。","media":"ロイター（TimesLIVE掲載）","url":"https://www.timeslive.co.za/news/world/2026-11-24-ethiopian-shelling-of-tigray-town-should-be-investigated-as-possible-war-crimes-amnesty-says/"}]},
{"cat":"tech","loc":[55.68,12.54,"コペンハーゲン"],"region":"欧州","accent":"#2e7bff","title":"抗がん剤タキソール、<span>タバコの仲間</span>で生産","lead":"コペンハーゲン大学などの研究チームが、抗がん剤タキソールが作られる仕組みの全体を解き明かし、タバコの仲間の植物に作らせることに成功した。イチイの木に頼ってきた生産を変える可能性がある。","src":{"name":"コペンハーゲン大学（EurekAlert!）","date":"11月23日","url":"https://www.eurekalert.org/news-releases/1153014"},"gist":"乳がんなどの治療に欠かせない薬を、育てやすい草で作れる道が開けた。実用化はまだ先だが、薬が安くなるかもしれない。","detail":["研究チームはイチイの遺伝子20個余りをベンサミアナタバコに組み込み、樹皮と同じくらいの濃さでタキソールを作らせた。","成果は科学誌ネイチャー・ケミカル・バイオロジーに11月23日付で掲載された。","今回は遺伝子を一時的に働かせる方法で、遺伝子を代々受け継ぐ植物をつくることが次の課題になる。"],"kw":["イチイ","ベンサミアナタバコ"],"views":[{"type":"専門家","who":"ソティリオス・カンプラニス","role":"コペンハーゲン大学教授（論文の責任著者）","stance":"薬を安くしたい","text":"最大の動機は、この薬を安くすることで社会に貢献できるかどうかだったと語った。乳がんの女性のほとんどが、いずれこの薬を使うと指摘した。","media":"Israel Hayom","url":"https://www.israelhayom.com/2026/11/24/scientists-successfully-produce-cancer-drug-from-tobacco-leaves"},{"type":"分析・データ","who":"ビクトリア・フォースター","role":"Forbes寄稿者","stance":"まだ初期段階","text":"今の生産はイチイの葉からの半合成や細胞培養に頼っていると説明したうえで、安定して作る植物の開発や収量、精製にはなお課題があり、研究は初期段階だと指摘した。","media":"Forbes（Yahoo掲載）","url":"https://www.yahoo.com/news/science/articles/common-cancer-drug-could-made-123000972.html"}]},
{"cat":"world","loc":[59.33,18.07,"ストックホルム"],"region":"欧州","accent":"#b6ff2e","title":"スウェーデン、組閣難航<span>72日</span>で首相採決へ","lead":"スウェーデン議会のノーレン議長は24日、穏健党のクリステション党首を首相候補に指名し、30日に議会で採決すると発表した。9月の総選挙から72日間、正式な政権がない状態が続いている。","src":{"name":"ロイター（The Star掲載）","date":"11月24日","url":"https://www.thestar.com.my/news/world/2026/11/24/swedish-parliament-to-vote-on-moderates-leader-kristersson-to-remain-prime-minister"},"gist":"選挙で左右どちらの陣営も安定した多数をまとめられず、政権づくりが行き詰まっている。採決に4回失敗すると、選挙のやり直しになる。","detail":["首相の採決は今回で3回目となる。4回失敗すると、3か月以内に再選挙が行われる。","クリステション氏は、穏健党、中央党、キリスト教民主党、自由党の4党による政権を目指している。","中央党は、スウェーデン民主党とは協力しない姿勢を崩していない。"],"kw":["首相候補","再選挙"],"views":[{"type":"当事者の声","who":"アンドレアス・ノーレン","role":"スウェーデン議会議長","stance":"再選挙の恐れも","text":"クリステション氏を首相候補に指名したうえで、再選挙となる恐れはなお大きいと述べた。","media":"ロイター（The Star掲載）","url":"https://www.thestar.com.my/news/world/2026/11/24/swedish-parliament-to-vote-on-moderates-leader-kristersson-to-remain-prime-minister"},{"type":"当事者の声","who":"エリザベト・タンド・リングクビスト","role":"中央党党首","stance":"協議には応じる","text":"クリステション氏とさらに協議する用意はあるが、政権への参加にはまだ合意していないとした。スウェーデン民主党と協力しない立場も変えていない。","media":"Daily Northern（SVTの報道を引用）","url":"https://www.dailynorthern.com/40196/parliament-to-vote-on-kristersson-as-prime-minister-on-monday/"}]},
{"cat":"tech","loc":[1.35,103.82,"シンガポール"],"region":"アジア","accent":"#8b5cff","title":"米、<span>半導体の横流し</span>疑いで7社を規制","lead":"米商務省は23日、エヌビディア製の半導体で計算能力を貸し出すシンガポールのメガスピードに関係する7社を、エンティティー・リストに加えた。中国アリババのシンガポール子会社も含まれる。","src":{"name":"ロイター（Yahoo Finance掲載）","date":"11月24日","url":"https://finance.yahoo.com/technology/ai/articles/singapore-investigating-nvidia-linked-megaspeed-023356234.html"},"gist":"先端のAI半導体が、規制をすり抜けて中国などに流れるのを止める狙いだ。指定された企業は、米国の技術を事実上手に入れられなくなる。","detail":["対象はシンガポール、マレーシア、タイの7社で、米国の規制品目を渡すには許可が要り、原則として認められない。","メガスピードは2024年から、中国への横流しの疑いで米当局の調べを受けてきた。","シンガポール政府も、自国の法律に違反がなかったかを調べている。"],"kw":["エンティティー・リスト","メガスピード"],"views":[{"type":"当事者の声","who":"ローレンス・ウォン","role":"シンガポール首相","stance":"違反には厳しく対処","text":"メガスピードへの調査は続いているとし、自国の法律に違反した企業が見つかれば断固とした措置をとると述べた。","media":"ロイター（Yahoo Finance掲載）","url":"https://finance.yahoo.com/technology/ai/articles/singapore-investigating-nvidia-linked-megaspeed-023356234.html"}]},
{"cat":"world","loc":[-6.12,106.15,"バンテン州セラン"],"region":"アジア","accent":"#19e3ff","title":"インドネシア菓子工場火災、<span>26人</span>死亡","lead":"インドネシアのバンテン州で21日に起きた菓子工場の火災で、死者は24日までに26人に増えた。警察は過失の疑いで刑事捜査を始めた。","src":{"name":"AP通信（Manufacturing.net掲載）","date":"11月24日","url":"https://www.manufacturing.net/operations/news/22978907/candy-factory-fire-death-toll-hits-26-as-police-launch-criminal-probe"},"gist":"大勢が働く工場で火が広がり、多くの人が逃げ遅れた。警報が鳴らなかったという証言もあり、安全管理が問われている。","detail":["工場は牛乳キャンディー「ミルキタ」を作っており、出火時には約300人が中にいた。","犠牲者の多くは出火場所に近い2階の非常階段付近で見つかった。10人は損傷が激しく、DNAでの身元確認が必要だ。","原因は冷房装置の可能性があるとされ、警察は19人から事情を聴き、安全記録や許可証を押収した。"],"kw":["バンテン州","非常階段"],"views":[{"type":"当事者の声","who":"ザイン・ドゥイ・ヌグロホ","role":"バンテン州警察副本部長","stance":"過失の疑い","text":"証拠は、火災を起こして他人を危険にさらした過失の疑いを示していると述べた。","media":"The Jakarta Post","url":"https://www.thejakartapost.com/indonesia/2026/11/24/death-toll-from-candy-factory-fire-rises-to-26-police"},{"type":"当事者の声","who":"インドネシア・オンブズマン","role":"行政監察機関","stance":"補償の明確化を","text":"会社と当局に、賃金や雇用形態、社会保障、労災の補償をはっきりさせるよう求め、職場の安全基準を見直すべきだとした。","media":"AP通信（1News掲載）","url":"https://www.1news.co.nz/2026/11/25/authorities-confirm-26-killed-in-indonesia-candy-factory-fire/"}]},
{"cat":"sports","loc":[41.1,28.99,"イスタンブール"],"region":"欧州","accent":"#ff2e88","title":"ガラタサライ、<span>終盤の一撃</span>でビラ撃破","lead":"欧州チャンピオンズリーグは24日にリーグフェーズ第5節があり、ガラタサライがアストン・ビラに1-0で勝った。ガラタサライは公式戦8連勝、ビラは6試合勝ちなしとなった。","src":{"name":"スカイスポーツ","date":"11月24日","url":"https://www.skysports.com/football/news/13615959/galatasaray-1-0-aston-villa-deniz-guls-late-winner-in-champions-league-league-phase-extends-villas-winless-run"},"gist":"トルコの名門が勢いに乗り、イングランドの強豪を本拠地で破った。ビラは点が取れない不振から抜け出せていない。","detail":["決勝点は後半終盤、デニズ・ギュルが頭で決めた。","ビラは枠内シュートを1本も打てず、11月8日から得点がない。","ガラタサライはこの大会で3連勝となり、勝ち点9でビラに並んだ。"],"kw":["リーグフェーズ","デニズ・ギュル"],"views":[{"type":"分析・データ","who":"スカイスポーツ","role":"英国のスポーツ報道機関","stance":"ビラの不振は深刻","text":"6試合勝ちがなく、枠内シュートもなかった内容は、ビラの不振の深さを示していると伝えた。","media":"Sky Sports","url":"https://www.skysports.com/football/news/13615959/galatasaray-1-0-aston-villa-deniz-guls-late-winner-in-champions-league-league-phase-extends-villas-winless-run"}]},

};
const KATA = /^[\u30A1-\u30FC]+$/, KCH = /[\u30A1-\u30FA\u30FC]/;
const GTERMS = Object.keys(GLOSS).sort((a, b) => b.length - a.length);
/* 長い登録語の一部になっている箇所では、短い語を当てない（「韓国総合株価指数」の中の「韓国」など） */
const GSUPER = Object.fromEntries(GTERMS.map(t => [t, GTERMS.filter(k => k !== t && k.includes(t)).map(esc)]));
const inLonger = (html, i, t, e) => GSUPER[t].some(ek => { for (let o = ek.indexOf(e); o > -1; o = ek.indexOf(e, o + 1)) if (i - o >= 0 && html.startsWith(ek, i - o)) return true; return false; });
const gloss = (html, used) => {
  for (const t of GTERMS){
    if (used.has(t)) continue;
    const e = esc(t); let i = html.indexOf(e);
    while (i > -1){
      const inTag = html.lastIndexOf("<", i) > html.lastIndexOf(">", i);
      const inBtn = html.lastIndexOf("<a class=\"g\"", i) > html.lastIndexOf("</a>", i);
      const kataBad = KATA.test(t) && (KCH.test(html[i - 1] || "") || KCH.test(html[i + e.length] || ""));
      if (!inTag && !inBtn && !kataBad && !inLonger(html, i, t, e)) break;
      i = html.indexOf(e, i + 1);
    }
    if (i < 0) continue;
    used.add(t);
    html = html.slice(0, i) + `<a class="g" role="button" tabindex="0" data-g="${e}" aria-expanded="false">${e}</a>` + html.slice(i + e.length);
  }
  return html;
};

function panes(n, no){

  P.push(`<div class="pane"><div class="in"><div class="tags"><span class="tag">${CAT[n.cat]}</span><span class="tag o">${esc(n.region)}</span><span class="tag o">全部で約${secs(n)}秒</span></div>

  n.views.forEach((v, k) => P.push(`<div class="pane"><div class="in"><div class="tags"><span class="tag w">${v.type === "専門家" ? "専門家の見解" : esc(v.type)} ${k+1} / ${n.views.length}</span><span class="tag o">${esc(v.stance)}</span></div>

  return P;
}

/* 見出しの改行：文節（助詞・句読点のあと）でまとまりを作り、その途中では改行しない */
const PHRASE = /([^、。！？」）]*?(?:から|まで|より|とは|では|には|へは|は|が|を|に|で|と|の|へ|も|や|、|。|！|？|」|）)(?=[^ぁ-んー、。！？」）]|$)|[^、。！？」）]+$)/g;
const phrase = el => {
  const runs = [...el.childNodes].map(n => [n.textContent, n.nodeType === 1]);
  const text = runs.map(r => r[0]).join("");
  const parts = text.split(/(?=「|（)/).flatMap(x => x.match(PHRASE) || [x]).filter(Boolean);
  if (parts.join("") !== text) return;
  const acc = []; for (const [t, a] of runs) for (const _ of t) acc.push(a);
  el.textContent = ""; let k = 0;
  for (const x of parts){
    const ph = document.createElement("span"); ph.className = "ph";
    let buf = "", cur = acc[k];
    const flush = () => { if (!buf) return; if (cur){ const a = document.createElement("span"); a.textContent = buf; ph.appendChild(a); } else ph.appendChild(document.createTextNode(buf)); buf = ""; };
    for (const ch of x){ if (acc[k] !== cur){ flush(); cur = acc[k]; } buf += ch; k++; }
    flush(); el.appendChild(ph);
  }
};
function render(){

let mapState = null;

const ISO3 = Object.fromEntries("AF:AFG,AL:ALB,DZ:DZA,AO:AGO,AR:ARG,AM:ARM,AU:AUS,AT:AUT,AZ:AZE,BS:BHS,BD:BGD,BY:BLR,BE:BEL,BZ:BLZ,BJ:BEN,BT:BTN,BO:BOL,BA:BIH,BW:BWA,BR:BRA,BN:BRN,BG:BGR,BF:BFA,BI:BDI,KH:KHM,CM:CMR,CA:CAN,CF:CAF,TD:TCD,CL:CHL,CN:CHN,CO:COL,CG:COG,CD:COD,CR:CRI,CI:CIV,HR:HRV,CU:CUB,CY:CYP,CZ:CZE,DK:DNK,DJ:DJI,DO:DOM,EC:ECU,EG:EGY,SV:SLV,GQ:GNQ,ER:ERI,EE:EST,ET:ETH,FJ:FJI,FI:FIN,FR:FRA,GA:GAB,GM:GMB,GE:GEO,DE:DEU,GH:GHA,GR:GRC,GL:GRL,GT:GTM,GN:GIN,GW:GNB,GY:GUY,HT:HTI,HN:HND,HU:HUN,IS:ISL,IN:IND,ID:IDN,IR:IRN,IQ:IRQ,IE:IRL,IL:ISR,IT:ITA,JM:JAM,JP:JPN,JO:JOR,KZ:KAZ,KE:KEN,KP:PRK,KR:KOR,KW:KWT,KG:KGZ,LA:LAO,LV:LVA,LB:LBN,LS:LSO,LR:LBR,LY:LBY,LT:LTU,LU:LUX,MK:MKD,MG:MDG,MW:MWI,MY:MYS,ML:MLI,MR:MRT,MX:MEX,MD:MDA,MN:MNG,ME:MNE,MA:MAR,MZ:MOZ,MM:MMR,NA:NAM,NP:NPL,NL:NLD,NZ:NZL,NI:NIC,NE:NER,NG:NGA,NO:NOR,OM:OMN,PK:PAK,PS:PSE,PA:PAN,PG:PNG,PY:PRY,PE:PER,PH:PHL,PL:POL,PT:PRT,PR:PRI,QA:QAT,RO:ROU,RU:RUS,RW:RWA,SA:SAU,SN:SEN,RS:SRB,SL:SLE,SG:SGP,SK:SVK,SI:SVN,SB:SLB,SO:SOM,ZA:ZAF,SS:SSD,ES:ESP,LK:LKA,SD:SDN,SR:SUR,SZ:SWZ,SE:SWE,CH:CHE,SY:SYR,TW:TWN,TJ:TJK,TZ:TZA,TH:THA,TL:TLS,TG:TGO,TT:TTO,TN:TUN,TR:TUR,TM:TKM,UG:UGA,UA:UKR,AE:ARE,GB:GBR,US:USA,UY:URY,UZ:UZB,VU:VUT,VE:VEN,VN:VNM,EH:ESH,YE:YEM,ZM:ZMB,ZW:ZWE,XK:KOS,BH:BHR,MT:MLT,KM:COM,MU:MUS,CV:CPV,NC:NCL,FK:FLK,GF:GUF,TF:ATF,AQ:ATA".split(",").map(x => x.split(":")));
for (const [a2, a3] of Object.entries(ISO3)) if (JA_NAMES[a2]) JA_NAMES[a3] = JA_NAMES[a2];
const loadScript = src => new Promise((ok, ng) => { const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = () => ng(new Error("load")); document.head.appendChild(el); });
const toShapes = feats => {
  const out = [];
  for (const f of feats){
    const g = f.geometry; if (!g) continue;
    const polys = g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
    let d = "", best = null, bestA = 0;
    for (const poly of polys){
      for (const ring of poly) d += "M" + ring.map(([lo, la]) => `${(lo + 180).toFixed(2)},${(78 - la).toFixed(2)}`).join("L") + "Z";
      let x0 = 999, x1 = -999, y0 = 999, y1 = -999;
      for (const [lo, la] of poly[0]){ x0 = Math.min(x0, lo); x1 = Math.max(x1, lo); y0 = Math.min(y0, la); y1 = Math.max(y1, la); }
      const a = (x1 - x0) * (y1 - y0); if (a > bestA){ bestA = a; best = [x0, x1, y0, y1]; }
    }
    const id = String(f.id || (f.properties && f.properties.id) || "");
    if (id === "AQ" || id === "ATA" || !best) continue;
    out.push({id, d, name: JA_NAMES[id] || (f.properties && f.properties.name) || id, x: (best[0] + best[1]) / 2 + 180, y: 78 - (best[2] + best[3]) / 2, size: best[1] - best[0]});
  }
  return out;
};
let geoP = null, geoErr = "";
/* 経路1：cdnjs の datamaps に入っている世界地図（Natural Earth 1:110m）を使う */
const viaCdnjs = async () => {
  if (!window.d3) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js");
  if (!window.topojson) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js");
  if (!window.Datamap) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.world.min.js");
  const topo = window.Datamap.prototype.worldTopo;
  return toShapes(window.topojson.feature(topo, topo.objects.world).features);
};
/* 経路2：jsDelivr の amCharts geodata */
const viaJsdelivr = async () => (await import("https://cdn.jsdelivr.net/npm/@amcharts/amcharts4-geodata@4.1.28/worldLow.js")).default;
const loadGeo = () => geoP || (geoP = (async () => {
  try { const r = await viaCdnjs(); if (r.length > 50) return r; geoErr += "1空 "; } catch(e){ geoErr += "1×(" + (e.message || "err").slice(0, 30) + ") "; }
  try { const r = toShapes((await viaJsdelivr()).features); if (r.length > 50) return r; geoErr += "2空"; } catch(e){ geoErr += "2×(" + (e.message || "err").slice(0, 30) + ")"; }
  return null;
})());
const paintGeo = (svg, list, iso, color) => {
  const hit = c => c.id === iso || c.id === ISO3[iso];
  const land = svg.querySelector(".land"); if (!land) return;
  land.outerHTML = `<g class="land">${list.map(c => `<path d="${c.d}" fill="${hit(c) ? color : "#3b3746"}" fill-opacity="${hit(c) ? .45 : 1}" stroke="#77718a" stroke-width=".7" vector-effect="non-scaling-stroke"/>`).join("")}</g><g class="names">${list.map(c => `<text x="${c.x}" y="${c.y}" data-s="${c.size}" text-anchor="middle" dominant-baseline="middle" fill="${hit(c) ? "#fff" : "rgba(245,243,238,.75)"}" font-weight="${hit(c) ? 900 : 700}">${esc(c.name)}</text>`).join("")}</g>`;
};
/* 小窓の開閉 */
const pop = $("#pop"); let openBtn = null;
const closePop = () => { if (openBtn) openBtn.setAttribute("aria-expanded", "false"); openBtn = null; pop.hidden = true; };
document.addEventListener("click", e => {
  const g = e.target.closest(".g");
  if (!g){ if (!e.target.closest("#pop")) closePop(); return; }
  e.stopPropagation();
  if (openBtn === g){ closePop(); return; }
  closePop(); openBtn = g; g.setAttribute("aria-expanded", "true");
  const v = GLOSS[g.dataset.g] || "", person = Array.isArray(v), place = v && v.place;
  const color = getComputedStyle(g.closest(".card") || document.body).getPropertyValue("--a").trim() || "#ffd60a";
  mapState = null;
  pop.classList.toggle("wide", !!place);
  pop.innerHTML = place ? `<small>地名</small><b>${esc(place[2])}</b>${esc(v.d)}${mapHTML(place[0], place[1], color)}`
    : `${person ? '<small>人物</small>' : ""}<b>${esc(person ? v[0] : g.dataset.g)}</b>${esc(person ? v[1] : v)}`;
  pop.hidden = false;
  if (place) initMap(pop, place[0], place[1], color);
  if (place){ const myMap = mapState; loadGeo().then(list => { if (mapState !== myMap) return; const note = pop.querySelector(".mapnote");
    if (list){ paintGeo(myMap.svg, list, v.iso, color); myMap.svg.appendChild(myMap.ring); myMap.svg.appendChild(myMap.pin); drawMap(); if (note) note.textContent = "国境は目安です。"; }
    else if (note) note.textContent = "国境データを読み込めなかったため、簡略図で表示しています（" + geoErr.trim() + "）。"; }); }
  const r = g.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  const left = Math.min(Math.max(16, r.left + r.width / 2 - w / 2), innerWidth - w - 16);
  const below = r.bottom + 10 + h < innerHeight - 90 || r.top - h - 10 < 8;
  pop.style.left = left + "px";
  pop.style.top = Math.max(8, Math.min(below ? r.bottom + 10 : r.top - h - 10, innerHeight - h - 8)) + "px";
}, true);
document.addEventListener("scroll", e => { if (!pop.contains(e.target)) closePop(); }, true);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closePop();
  const g = e.target.closest && e.target.closest(".g");
  if (g && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); g.click(); }
});

/* 共有リンク：記事ごとに #n01 のようなアドレスを付ける */
const ARCHIVED = /\/archive\/\d{4}-\d{2}-\d{2}\/?/.test(location.pathname);
const ROOT = ARCHIVED ? location.pathname.replace(/archive\/.*$/, "") : location.pathname.replace(/[^/]*$/, "");
const DAY = ISSUE.date.slice(0, 10).replace(/\./g, "-");
const BASE = location.origin + ROOT + "archive/" + DAY + "/";
const tag = k => k > list.length || (k === list.length && !feed.querySelector(".others")) ? "matome" : k === list.length ? "others" : "n" + String(ORDER.indexOf(list[k]) + 1).padStart(2, "0");
const toast = $("#toast"); let tt = 0;
const say = (html, ms = 2200) => { toast.innerHTML = html; toast.hidden = false; clearTimeout(tt); tt = setTimeout(() => toast.hidden = true, ms); };
/* シェア：記事のリンクボタンでメニューを出し、記事かサイトかを選ぶ。
   スマホは端末の共有メニュー（LINE・Xなど）を開き、それがない環境ではリンクをコピーする */
/* サイトのURLには ?s=dope を付ける。旧名時代にLINEやXが覚えたカードではなく、新しいカードを読み直させるため */
const SITE_TITLE = "DOPE｜縦スクロールでニュースを読む。", SITE_URL = location.origin + ROOT + "?s=dope";
const artUrl = no => BASE + "n" + String(no).padStart(2, "0") + "/?s=dope";
const copyLink = async (url, msg) => {
  try { await navigator.clipboard.writeText(url); say(msg); }
  catch (err) { say(`コピーできませんでした。長押しで選んでコピーしてください：<br>${esc(url)}`, 6000); }
};
const shareTo = async (title, url, msg) => {
  if (navigator.share){ try { await navigator.share({title, url}); return; } catch (err){ if (err && err.name === "AbortError") return; } }
  copyLink(url, msg);
};
const ssheet = $("#shareSheet"); let shareNo = 0, shareLast = null;
const openShare = no => {
  closePop(); shareNo = no; shareLast = document.activeElement;
  const n = NEWS[ORDER[no - 1]]; $("#shareTitle").textContent = n ? plain(n.title) : "";
  ssheet.hidden = false; $("#shArt").focus({preventScroll:true});
};
const closeShare = () => { if (ssheet.hidden) return; ssheet.hidden = true; if (shareLast && shareLast.focus) shareLast.focus({preventScroll:true}); };
feed.addEventListener("click", e => {
  const b = e.target.closest("[data-share]");
  if (b){ e.stopPropagation(); openShare(+b.dataset.share); return; }
  if (e.target.closest("[data-share-site]")){ e.stopPropagation(); shareTo(SITE_TITLE, SITE_URL, "DOPEのリンクをコピーしました"); }
}, true);
$("#shArt").onclick = () => { const n = NEWS[ORDER[shareNo - 1]]; closeShare(); shareTo(n ? plain(n.title) + "｜DOPE" : SITE_TITLE, artUrl(shareNo), "この記事のリンクをコピーしました"); };
$("#shSite").onclick = () => { closeShare(); shareTo(SITE_TITLE, SITE_URL, "DOPEのリンクをコピーしました"); };
$("#shCopy").onclick = () => { closeShare(); copyLink(artUrl(shareNo), "この記事のリンクをコピーしました"); };

ssheet.addEventListener("click", e => { if (e.target === ssheet) closeShare(); });
ssheet.addEventListener("keydown", e => {
  if (e.key === "Escape"){ e.stopPropagation(); closeShare(); return; }
  if (e.key !== "Tab") return;
  const f = [...ssheet.querySelectorAll("button")]; const i = f.indexOf(document.activeElement);
  if (e.shiftKey && i <= 0){ e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && i === f.length - 1){ e.preventDefault(); f[0].focus(); }
});
{ /* 下へスワイプで閉じる */
  const sp = ssheet.querySelector(".panel"); let sy = null;
  sp.addEventListener("touchstart", e => { sy = e.touches[0].clientY; }, {passive:true});
  sp.addEventListener("touchmove", e => { if (sy !== null && e.touches[0].clientY - sy > 60){ sy = null; closeShare(); } }, {passive:true});
}
const openFromHash = h => {
  const m = /^#n(\d{2})$/.exec(typeof h === "string" ? h : location.hash); if (!m) return;
  const idx = ORDER[+m[1] - 1]; if (idx === undefined) return;
  if (cat !== "all"){ cat = "all"; render(); }
  const k = list.indexOf(idx); if (k > -1) feed.children[k].scrollIntoView({behavior:"auto"});
};
addEventListener("hashchange", openFromHash);

/* 縦スクロールの引っかかり対策：中身がはみ出すパネルだけ内側でスクロールさせる */
const markTall = () => feed.querySelectorAll(".pane").forEach(p => p.classList.toggle("tall", p.scrollHeight > p.clientHeight + 4));
addEventListener("resize", () => requestAnimationFrame(markTall));

/* 半透明の上下バー：高さを測って、カードの中身がバーに隠れないようにする */
const barSize = () => { const r = document.documentElement.style; r.setProperty("--hh", document.querySelector("header").offsetHeight + "px"); r.setProperty("--fh", document.querySelector("footer").offsetHeight + "px"); };
barSize(); addEventListener("resize", barSize);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { barSize(); markTall(); });

/* 過去号：アーカイブ内のページでは「最新号へ」を出し、リンク先をそろえる */
if (ARCHIVED){ const l = $("#latest"); l.href = ROOT; l.hidden = false; }
const fixBackno = () => feed.querySelectorAll(".backno").forEach(a => a.href = ROOT + "archive/");

/* 号えらび：上の日付を押すと、保存されている号へすぐ移れる。号の目録は archive/days.json（tools/publish_day.py が作る） */
const sheet = $("#sheet"), dateBtn = $("#dateBtn"), strip = $("#strip");
$("#sheetAll").href = ROOT + "archive/";
let daysP = null, lastFocus = null;
const loadDays = () => daysP || (daysP = fetch(ROOT + "archive/days.json", {cache:"no-cache"})
  .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
  .catch(e => { daysP = null; throw e; }));
const paintDays = days => {
  if (!Array.isArray(days) || !days.length){ strip.innerHTML = '<p class="snote">まだ保存された号がありません。</p>'; return; }
  strip.innerHTML = days.map((d, i) => {
    const [, m, dd] = d.date.split("-"), here = d.date === DAY;
    const href = i === 0 ? ROOT : ROOT + "archive/" + d.date + "/";
    const badges = (i === 0 ? '<i>最新</i>' : "") + (here ? '<i class="now">表示中</i>' : "");
    return `<a class="day${here ? " here" : ""}" href="${esc(href)}"${here ? ' aria-current="page"' : ""}>
      <span class="dtop"><b>${+m}.${+dd}</b><small>${esc(d.wd)}曜</small></span><span class="badges">${badges}</span>
      <span class="dn">${+d.n}本</span><span class="dt">${esc(d.top || "")}</span></a>`;
  }).join("");
  const h = strip.querySelector(".here"); if (h) strip.scrollLeft = h.offsetLeft - 16;
};
const sheetFocus = () => [...sheet.querySelectorAll("a[href],button")];
const openSheet = () => {
  closePop(); lastFocus = document.activeElement;
  sheet.hidden = false; dateBtn.setAttribute("aria-expanded", "true");
  strip.innerHTML = '<p class="snote">読み込み中…</p>'; $("#sheetX").focus();
  loadDays().then(paintDays).catch(() => { strip.innerHTML = `<p class="snote">号の一覧を読み込めませんでした。<a href="${esc(ROOT + "archive/")}">過去の号の一覧</a>から選んでください。</p>`; })
    .finally(() => { if (!sheet.hidden){ const t = strip.querySelector(".here") || strip.querySelector(".day"); if (t) t.focus({preventScroll:true}); } });
};
const closeSheet = () => { if (sheet.hidden) return; sheet.hidden = true; dateBtn.setAttribute("aria-expanded", "false"); if (lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true}); };
dateBtn.addEventListener("click", () => sheet.hidden ? openSheet() : closeSheet());
$("#sheetX").addEventListener("click", closeSheet);
sheet.addEventListener("click", e => {
  if (e.target === sheet){ closeSheet(); return; }

});
sheet.addEventListener("keydown", e => {
  if (e.key === "Escape"){ e.stopPropagation(); closeSheet(); return; }
  if (e.key !== "Tab") return;
  const f = sheetFocus(); if (!f.length) return;
  const i = f.indexOf(document.activeElement);
  if (e.shiftKey && i <= 0){ e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && i === f.length - 1){ e.preventDefault(); f[0].focus(); }
});
render();
openFromHash(START_HASH);
fixBackno();
markTall();
}
