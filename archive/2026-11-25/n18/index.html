<h1>韓国、31機関を世宗市へ移転</h1>
<p>韓国の行政安全省は24日、中央の31の機関と公務員5460人を、2031年までに行政都市の世宗市へ移す計画を告示した。当初は44の機関を移す計画だったが、13機関が対象から外れた。</p>
