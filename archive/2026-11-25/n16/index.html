<h1>エストニア、ロシア国境の検問所閉鎖へ</h1>
<p>エストニア政府はロシアとの国境の道路検問所を12月1日から閉じると決め、ロシア外務省は23日、同国の代理大使を呼んで抗議した。ロシアは「新たな鉄のカーテン」だと反発している。</p>
