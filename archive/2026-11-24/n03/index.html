<h1>日欧の水星探査機、8年かけ軌道入り</h1>
<p>日本と欧州の水星探査機「ベピコロンボ」が、2018年の打ち上げから8年をかけて水星を回る軌道に入った。日本の「みお」と欧州のMPOの2機で、水星を同時に観測する計画が動き出す。</p>
