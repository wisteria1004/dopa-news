<h1>コンゴのエボラ、戦闘で対応チーム足止め</h1>
<p>コンゴ民主共和国東部で病院近くの戦闘が起き、エボラ対応のチームが24時間以上身を隠した。死者は5775人に達し、同国で過去最悪の流行は収まる見通しが立たない。</p>
