<h1>リビア東部勢力、ウクライナに報復宣言</h1>
<p>リビア東部を支配するリビア国民軍は25日、ベンガジの港でロシア軍艦を狙ったウクライナの攻撃によりリビアの海軍将校2人が死亡したとして、ウクライナへの報復を宣言した。ロシアとウクライナの戦争が北アフリカに広がっている。</p>
