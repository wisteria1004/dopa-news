<h1>ロシア攻撃で9人死亡、発電所も停止</h1>
<p>ウクライナ各地で24日から25日にかけてロシア軍の攻撃が続き、9人が死亡、12歳の子どもを含む59人がけがをした。民間電力会社のDTEKは、火力発電所の1つが大きな被害を受け、発電が止まったと発表した。</p>
