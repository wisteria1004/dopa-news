<h1>コロンビアの人質事件、全員救出</h1>
<p>コロンビア北部カルタヘナのスーパーで武装した男たちが人質を取って立てこもった事件で、警察と軍の特殊部隊が25日未明に突入し、人質全員を救出した。犯人の1人が死亡し、4人が逮捕された。</p>
