<small>DOPE・11月26日号</small>
<h1>米、日中など14か国・地域に新関税案</h1>
<p>米通商代表部は25日、過剰な生産を招く補助金などを理由に、中国やEU、日本など14の国・地域に新たな関税を課す案を発表した。中国には20%を上乗せし、日本やEUなどは貿易合意で決めた15%の上限に収める。</p>
