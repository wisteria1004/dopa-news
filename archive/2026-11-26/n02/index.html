<small>DOPE・11月26日号</small>
<h1>ホルムズ海峡でタンカー2隻が機雷に</h1>
<p>イランの革命防衛隊海軍は25日、ホルムズ海峡でタンカー2隻が機雷に触れて爆発し、炎上したと国営メディアを通じて発表した。2隻が「許可されていない航路」を通ったためだとしており、原油輸送の要所で緊張が続いている。</p>
