<h1>スーダン南東部、無人機で市民19人死亡</h1>
<p>スーダンの人権団体の緊急弁護士団は25日、南東部の青ナイル州の州都ダマジンで、即応支援部隊の無人機攻撃により市民19人が死亡したと発表した。住宅地のほか、発電所やダムの施設も狙われた。</p>
