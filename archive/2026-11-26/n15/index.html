<h1>泥炭地の排水、温暖化の2.7%生む</h1>
<p>米マサチューセッツ工科大学などの研究チームは25日、湿地の泥炭地から水を抜いてきたことが、人間による今の温暖化の約2.7%を生んでいるとネイチャーに発表した。水を抜いた泥炭は、何百年も二酸化炭素を出し続けるという。</p>
