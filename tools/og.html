<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#08080d;color:#f5f3ee;font-family:"Noto Sans CJK JP",sans-serif;position:relative}
.glow1{position:absolute;inset:0;background:radial-gradient(55% 75% at 92% 8%,rgba(255,46,136,.55),transparent 70%),radial-gradient(45% 60% at 0% 100%,rgba(182,255,46,.28),transparent 70%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1.4px,transparent 1.6px);background-size:22px 22px}
.bar{position:absolute;left:0;top:0;height:10px;width:100%;background:linear-gradient(90deg,#ff2e88,#ff6b1a,#ffd60a,#b6ff2e,#19e3ff,#2e7bff,#8b5cff)}
.num{position:absolute;right:-30px;top:30px;font:900 520px/1 "Archivo Black",sans-serif;color:rgba(245,243,238,.07);transform:scaleX(.72);transform-origin:right top;letter-spacing:-10px}
.wrap{position:absolute;left:84px;top:64px}
.pill{display:inline-flex;align-items:center;gap:12px;font-weight:900;font-size:28px;padding:10px 24px;border:2px solid #34303b;border-radius:999px;background:rgba(18,16,24,.85)}
.pill i{width:14px;height:14px;border-radius:50%;background:#b6ff2e;box-shadow:0 0 14px #b6ff2e}
h1{font:400 250px/1 "Archivo Black",sans-serif;margin-top:34px;letter-spacing:-6px;color:#ff2e88}
h1 span{color:#ffd60a}
p{font-weight:700;font-size:44px;color:#f5f3ee;margin-top:26px}
.cats{display:flex;gap:34px;margin-top:22px;font-weight:900;font-size:28px;color:#a39da8}
.cats b{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:10px;vertical-align:4px}
</style></head><body>
<div class="glow1"></div><div class="dots"></div><div class="bar"></div>
<div class="num">01</div>
<div class="wrap">
<div class="pill"><i></i>毎朝更新</div>
<h1>DOPE<span>.</span></h1>
<p>縦スクロールでニュースを読む。</p>
<div class="cats"><span><b style="background:#ff2e88"></b>世界</span><span><b style="background:#19e3ff"></b>テック・科学</span><span><b style="background:#ffd60a"></b>スポーツ</span></div>
</div></body></html>
