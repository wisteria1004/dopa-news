{cat:"tech",loc:[37.77,-122.42,"アメリカ・サンフランシスコ"],region:"アメリカ",accent:"#8b5cff",

{cat:"tech",loc:[34.14,-118.13,"アメリカ・カリフォルニア工科大学"],region:"宇宙",accent:"#19e3ff",
 title:"星は<span>爆発せず</span>ブラックホールになる？",
 lead:"重い星は最期に爆発すると考えられてきた。だが重力波のデータは、爆発せずにつぶれる星の存在を示している。",
 src:{name:"ScienceDaily",date:"11月22日",url:"https://www.sciencedaily.com/releases/2026/11/261121221126.htm"},
 gist:"重い星は最期に超新星爆発を起こすと考えられてきたが、爆発せずにブラックホールになる星も多い可能性が出てきた。星の一生の理解を見直すきっかけになりうる。",
 detail:["カリフォルニア工科大学が中心の研究。重力波で捉えたブラックホールの合体257件を分析した。", "太陽の約10倍の重さのブラックホールに、目立つ集まりがあった。", "その多くは、爆発しないままつぶれた星から生まれた可能性がある。失敗した超新星の確かな実例は、まだない。"],
 kw:["重力波","失敗した超新星"],
 views:[
  {type:"分析・データ",who:"カリフォルニア工科大学",role:"研究チームの発表",stance:"慎重な表現",text:"データは、このブラックホールの一群が共通の生まれ方をした別グループかもしれないことを示している。ただし失敗した超新星の確かな実例は、まだ1つも確認されていない。",media:"Caltech",url:"https://www.caltech.edu/about/news/astronomers-find-hints-of-star-population-that-failed-to-explode"}]},

const GTERMS = Object.keys(GLOSS).sort((a, b) => b.length - a.length);
const gloss = (html, used) => {
  for (const t of GTERMS){
    if (used.has(t)) continue;
    const e = esc(t); let i = html.indexOf(e);
    while (i > -1){
      const inTag = html.lastIndexOf("<", i) > html.lastIndexOf(">", i);
      const inBtn = html.lastIndexOf("<button", i) > html.lastIndexOf("</button>", i);
      if (!inTag && !inBtn) break;
      i = html.indexOf(e, i + 1);
    }
    if (i < 0) continue;
    used.add(t);
    html = html.slice(0, i) + `<button type="button" class="g" data-g="${e}" aria-expanded="false">${e}</button>` + html.slice(i + e.length);
  }
  return html;
};

function panes(n, no){
  const P = [], used = new Set(), T = h => gloss(h, used);
  P.push(`<div class="pane"><div class="in"><div class="tags"><span class="tag">${CAT[n.cat]}</span><span class="tag o">${esc(n.region)}</span><span class="tag o">全部で約${secs(n)}秒</span></div>
    <h2>${n.title}</h2><p class="lead">${T(color(n.lead, n.kw))}</p>
    <div class="src">出典：${link(esc(n.src.name), n.src.url)}・${esc(n.src.date)}</div>
    <div class="go">横に流すと詳細 <span>→</span></div></div></div>`);
  P.push(`<div class="pane"><div class="in"><div class="tags"><span class="tag y">ざっくり言うと</span></div><p class="big">${T(color(n.gist, n.kw))}</p></div></div>`);
  n.detail.forEach((d, k) => P.push(`<div class="pane"><div class="in"><div class="tags"><span class="tag">くわしい話 ${k+1}</span></div><p class="big xl">${T(color(d, n.kw))}</p>${k === n.detail.length-1 ? `<div class="src">出典：${link(esc(n.src.name), n.src.url)}（${esc(n.src.date)}）</div>` : ""}</div></div>`));
  n.views.forEach((v, k) => P.push(`<div class="pane"><div class="in"><div class="tags"><span class="tag w">${v.type === "専門家" ? "専門家の見解" : esc(v.type)} ${k+1} / ${n.views.length}</span><span class="tag o">${esc(v.stance)}</span></div>
    <div class="who">${esc(v.who)}</div><div class="role">${esc(v.role)}</div><p class="big">要約：${T(esc(v.text))}</p>
    <div class="src">出典：${link(esc(v.media), v.url)}</div>${k === n.views.length-1 ? `<p class="note">見解は発言や分析の要約です。「専門家の見解」は専門家本人、「当事者の声」は関係者・機関の説明、「分析・データ」は機関や媒体の分析です。${n.views.length < 2 ? "別の媒体で確認できた見解は1件だけのため、無理に増やしていません。" : ""}</p>` : ""}</div></div>`));
  return P;
}

  return `<section class="card others" id="others" style="--a:#19e3ff" aria-label="ほかのニュース">

}
function render(){
  list = ORDER.filter(i => cat === "all" || NEWS[i].cat === cat);
  const counts = {all:NEWS.length}; NEWS.forEach(n => counts[n.cat] = (counts[n.cat]||0) + 1);
  chips.innerHTML = [["all","すべて"],["world","世界"],["tech","テック・科学"],["sports","スポーツ"]].map(([k,l]) => `<button class="chip" type="button" data-c="${k}" aria-pressed="${k===cat}">${l}<b>${counts[k]||0}</b></button>`).join("");
  feed.innerHTML = list.map((i, k) => {
    const n = NEWS[i], P = panes(n, k), key = plain(n.title);
    return `<section class="card" data-k="${k}" style="--a:${n.accent}" aria-label="${esc(key)}">
      <div class="blob"></div><div class="num" aria-hidden="true">${String(ORDER.indexOf(i)+1).padStart(2,"0")}</div>

      <div class="bars" aria-hidden="true">${P.map((_, j) => `<i class="${j ? "" : "on"}"></i>`).join("")}</div>
    </section>`;
  }).join("") + othersCard() + closing();
  dotsEl.innerHTML = list.map(() => "<i></i>").join("") + (feed.querySelector(".others") ? "<i></i>" : "") + "<i></i>";
  $("#tot").textContent = list.length;
  feed.scrollTop = 0; setCur(0);
  feed.querySelectorAll(".card:not(.end) .track").forEach(t => t.addEventListener("scroll", () => {
    const j = Math.round(t.scrollLeft / t.clientWidth);
    t.parentElement.querySelectorAll(".bars i").forEach((b, x) => b.classList.toggle("on", x === j));
  }, {passive:true}));
  feed.querySelectorAll(".card").forEach(c => io.observe(c));
}

function setCur(k){
  cur = k;
  try { if (location.hash !== "#" + tag(k)) history.replaceState(null, "", "#" + tag(k)); } catch(e){}
  const atEnd = k >= list.length;
  $("#cur").textContent = Math.min(k + 1, list.length);
  const hasO = !!feed.querySelector(".others"), endK = list.length + (hasO ? 1 : 0);
  $("#nextL").textContent = k >= endK ? "最初にもどる" : k === list.length && hasO ? "まとめへ" : k === list.length - 1 ? (hasO ? "ほかのニュースへ" : "まとめへ") : "次のニュース";
  dotsEl.querySelectorAll("i").forEach((d, x) => d.classList.toggle("on", x === k));
  clearTimeout(dwell);
  if (!atEnd){ const key = plain(NEWS[list[k]].title); dwell = setTimeout(() => { if (cur === k && !read.has(key)){ read.add(key); store.set(KEY + "-read", [...read]); paintRead(); } }, 1200); }
}

  if (cat !== "all"){ cat = "all"; render(); }
  const k = list.indexOf(idx); if (k > -1) feed.children[k].scrollIntoView({behavior:"auto"});
};
addEventListener("hashchange", openFromHash);
render();
openFromHash();
}
</script>
