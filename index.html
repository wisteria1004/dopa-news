{"cat": "world", "loc": [55.75, 37.62, "モスクワ"], "region": "欧州", "accent": "#ffd60a", "title": "ロシア<span>核搭載衛星</span>、年内打ち上げか", "lead": "ロシアが核兵器を積んだ衛星を年内に打ち上げる準備をしていると、NATO加盟国の情報機関がみている。ドイツのメディアが23日に報じ、ロシア側は報道を退けた。", "src": {"name": "ロイター", "date": "11月23日", "url": "https://www.internazionale.it/ultime-notizie-reuters/2026/11/23/nato-believes-russia-is-ready-to-launch-nuclear-armed-satellite-german-media-say"}, "gist": "宇宙で核兵器が爆発すれば、通信や位置情報を支える衛星がまとめて使えなくなるかもしれない。報道が事実なら、宇宙が核をめぐる新たな対立の場になる。", "detail": ["報道によると、この衛星は数年前に組み立てられ、モスクワ周辺に置かれている。", "ドイツ首相府の報道官は、報道を非常に深刻に受け止めていると述べた。BNDなどは情報評価についてコメントしなかった。", "1967年の条約は大量破壊兵器を宇宙に置くことを禁じており、ロシアも締約国だ。"], "kw": ["NATO", "1967年の条約"], "views": [{"type": "専門家", "who": "ウィリアム・アルバーク", "role": "元NATO核不拡散センター長、パシフィック・フォーラム", "stance": "公表で抑止", "text": "ドイツ政府は情報を表に出すことでロシアを思いとどまらせようとするほど懸念していると指摘した。宇宙での核爆発はロシア自身や中国など友好国の衛星にも損害を与える可能性が高いと述べた。", "media": "ニューズウィーク（Yahoo掲載）", "url": "https://www.yahoo.com/news/politics/articles/russia-launch-nuclear-armed-satellite-112735132.html"}, {"type": "当事者の声", "who": "ドミトリー・ペスコフ", "role": "ロシア大統領報道官", "stance": "報道を一蹴", "text": "ロシアが年内に核搭載衛星を打ち上げるとするドイツメディアの報道について、真剣に受け止める価値はないと退けた。", "media": "テュルキエ・トゥデイ", "url": "https://www.turkiyetoday.com/world/russia-calls-ukraines-baltic-ship-strike-very-dangerous-trend-of-escalation-3233060"}]},
{"cat": "tech", "loc": [49.87, 8.62, "ダルムシュタット（ESA運用センター）"], "region": "宇宙", "accent": "#2e7bff", "title": "日欧の水星探査機、<span>8年かけ</span>軌道入り", "lead": "日本と欧州の水星探査機「ベピコロンボ」が、2018年の打ち上げから8年をかけて水星を回る軌道に入った。日本の「みお」と欧州のMPOの2機で、水星を同時に観測する計画が動き出す。", "src": {"name": "Gizmodo", "date": "11月23日", "url": "https://gizmodo.com/bepicolombo-reached-mercury-after-8-years-theres-just-one-problem-2000843996"}, "gist": "太陽に最も近く、内側の惑星で最も調べが進んでいない水星を、2機が同時に観測できる段階に近づいた。ただ軌道に入る際の噴射に不具合があり、今後の手順に響くかが焦点だ。", "detail": ["軌道投入の噴射はソフトウェアの不具合で予定より短く終わったが、ESAは探査機は安全だとしている。", "12月9〜10日に「みお」を最終軌道へ運んで切り離し、本格的な科学観測は2027年4月に始まる予定だ。", "2024年に推進装置の出力不足が起き、到着は当初予定の2025年12月から遅れていた。"], "kw": ["ベピコロンボ", "みお"], "views": [{"type": "当事者の声", "who": "ゲラント・ジョーンズ", "role": "ESA ベピコロンボ計画 主任プロジェクト科学者", "stance": "2機同時観測", "text": "2機の探査機が同じ時に水星で観測することで、これまでにない測定が可能になると述べた。探査機と観測機器はできる限り低温に保つ必要があるとも説明した。", "media": "Deseret News（AP取材の発言を引用）", "url": "https://www.deseret.com/the-west/2026/11/23/after-eight-years-bepicolombo-reaches-mercury/"}, {"type": "当事者の声", "who": "ESA運用チーム", "role": "欧州宇宙機関（公式X）", "stance": "不具合を調査", "text": "噴射はソフトウェアの問題で予定より短くなったが、探査機は安全であり、運用センターのチームが原因を調べていると説明した。", "media": "Gizmodo", "url": "https://gizmodo.com/bepicolombo-reached-mercury-after-8-years-theres-just-one-problem-2000843996"}]},
{"cat": "world", "loc": [32.12, 20.07, "ベンガジ"], "region": "欧州・アフリカ", "accent": "#ff6b1a", "title": "ウクライナ、<span>遠方の海</span>でロシア船攻撃", "lead": "ゼレンスキー大統領は23日、リビアの港でロシア軍艦を海上ドローンで沈めたと発表した。同じ週末にはバルト海でもロシアの貨物船が攻撃され、戦火が戦場の外へ広がっている。", "src": {"name": "CBSニュース（AP）", "date": "11月23日", "url": "https://www.cbsnews.com/news/ukraine-zelenskyy-2-russian-ships-libya/"}, "gist": "ウクライナから遠く離れた北アフリカや北欧の海でロシアの船が相次いで狙われた。周辺国も巻き込まれ、緊張が高まっている。", "detail": ["ゼレンスキー氏は、国産の海上ドローン7機を使い、艦上のヘリコプターも破壊したと述べた。", "リビアの大統領評議会は攻撃をリビア国家への宣戦布告だと非難し、国際司法裁判所と国連安全保障理事会に訴えるとした。", "フィンランド湾ではロシアの貨物船スパルタIIがドローン2機の攻撃を受けて炎上し、ロシア、エストニア、フィンランドの船が2日がかりで消火した。"], "kw": ["海上ドローン", "バルト海"], "views": [{"type": "当事者の声", "who": "ウォロディミル・ゼレンスキー", "role": "ウクライナ大統領", "stance": "侵略への反撃", "text": "ロシアの戦争に対する模範的な作戦だったとして保安庁などに謝意を示し、設定した目標は達成されたと述べた。", "media": "CBSニュース（AP）", "url": "https://www.cbsnews.com/news/ukraine-zelenskyy-2-russian-ships-libya/"}, {"type": "当事者の声", "who": "ドミトリー・ペスコフ", "role": "ロシア大統領報道官", "stance": "報復を示唆", "text": "バルト海での攻撃をテロ活動の拡大という非常に危険な傾向だとし、沿岸国にキーウへの影響力を使うよう求めた。リビアでの攻撃へのロシアの対応は非常に痛みを伴うものになると述べた。", "media": "テュルキエ・トゥデイ", "url": "https://www.turkiyetoday.com/world/russia-calls-ukraines-baltic-ship-strike-very-dangerous-trend-of-escalation-3233060"}]},
{"cat": "world", "loc": [32.166, 34.844, "ヘルツリーヤ"], "region": "中東", "accent": "#b6ff2e", "title": "イスラエル連立協議、<span>合意なし</span>で終了", "lead": "イスラエルで組閣を任されたアイゼンコット氏の党と、ネタニヤフ暫定首相のリクードの連立協議が、合意なく終わった。12月6日の期限を前に、少数与党での政権発足も現実味を帯びる。", "src": {"name": "アルジャジーラ（AP・アナドル通信）", "date": "11月22日", "url": "https://www.aljazeera.com/news/2026/11/22/netanyahus-likud-eisenkots-yashar-end-coalition-talks-without-deal"}, "gist": "10月の総選挙でどちらの陣営も過半数を取れず、次の首相がだれになるかがまだ決まらない。ネタニヤフ氏が政権に残るかどうかが最大の争点だ。", "detail": ["両党は首相をどちらが務めるか、極右のベングビール国家安全保障相を政権に入れるかで対立したまま、次回協議の日程も示さなかった。", "アイゼンコット氏の陣営は48議席で、過半数の61議席に13足りない。アラブ系政党は過去最多の19議席を得た。", "協議が失敗した場合、ヤシャルはアラブ系2党の閣外協力を頼りに、少数与党政権の信任投票を国会に求める方針だ。"], "kw": ["連立協議", "少数与党"], "views": [{"type": "当事者の声", "who": "ナフタリ・ベネット", "role": "元首相、アイゼンコット氏の同盟者", "stance": "ネタニヤフ排除", "text": "「アイゼンコット氏が率いるシオニストの統一政権」を求め、自らの党はネタニヤフ氏やその陣営とは組まないと改めて表明した。", "media": "マニラ・タイムズ（AFP配信）", "url": "https://www.manilatimes.net/2026/11/23/world/americas-emea/eisenkot-netanyahu-parties-resume-coalition-negotiations/2475676"}, {"type": "分析・データ", "who": "Kan（イスラエル公共放送）", "role": "イスラエル公共放送の報道", "stance": "奇襲的な組閣", "text": "アイゼンコット氏は数週間以内に予告なく組閣完了を宣言し、1〜2日のうちに国会で採決に持ち込む構えだと報じた。超正統派、アラブ系、リクードのいずれとも実質的な進展はないという。", "media": "タイムズ・オブ・イスラエル", "url": "https://www.timesofisrael.com/liveblog-november-23-2026/"}]},
{"cat": "sports", "loc": [45.0703, 7.6869, "トリノ（イタリア）"], "region": "欧州", "accent": "#8b5cff", "title": "アルカラス、<span>ATPファイナルズ</span>初優勝", "lead": "テニスのアルカラスが22日、ATPファイナルズ決勝で世界1位のズベレフを6-2、7-6で破り、初優勝した。四大大会すべてと年間最終戦を制した男子選手は、史上4人目となった。", "src": {"name": "ATPツアー", "date": "11月22日", "url": "https://www.atptour.com/en/news/alcaraz-zverev-nitto-atp-finals-2026-sunday"}, "gist": "年間の上位8人だけが出る大会で勝ち、23歳でテニス界の主要タイトルをすべてそろえた。手首のけがで長く休んだ選手が、復帰後に頂点へ戻ったことを示す結果だ。", "detail": ["スペイン人の優勝は1998年のアレックス・コレチャ以来で、優勝賞金は大会最高の517万1000ドルだった。", "アルカラスは手首のけがで4カ月以上離脱し、8月の全米オープンで復帰した。", "ズベレフは今季、全仏と全米で初の四大大会優勝を果たし、年間最終ランキング1位を確定させている。"], "kw": ["手首", "年間最終ランキング"], "views": [{"type": "当事者の声", "who": "カルロス・アルカラス", "role": "男子テニス選手（スペイン）", "stance": "長年の目標達成", "text": "最高の形で1週間を終えられて誇らしいと述べ、このトロフィーは長い間追い続けてきたものだと語った。", "media": "AFP（Arab News掲載）", "url": "https://www.arabnews.com/tennis/alcaraz-downs-zverev-to-win-atp-finals-for-first-time-3013590"}, {"type": "分析・データ", "who": "ATPツアー", "role": "男子プロテニス統括団体", "stance": "記録ずくめ", "text": "アルカラスは2月の全豪優勝で最年少の生涯グランドスラムを達成しており、今回で四大大会と最終戦をすべて制した4人目の男子となった。決勝でのズベレフ戦は3戦全勝で、世界2位シナーとの差を350ポイントに縮めた。", "media": "ATPツアー", "url": "https://www.atptour.com/en/news/alcaraz-zverev-nitto-atp-finals-2026-sunday"}]},
{"cat": "tech", "loc": [37.57, 126.98, "ソウル"], "region": "アジア", "accent": "#19e3ff", "title": "AIバブル懸念で韓国株<span>3.3%</span>下落", "lead": "AI関連株の急落を受け、23日の韓国総合株価指数は一時5.8%下げ、3.31%安で取引を終えた。サムスン電子やSKハイニックスが売られ、AI投資の過熱を疑う見方がアジアにも広がった。", "src": {"name": "聯合ニュース（Korea JoongAng Daily掲載）", "date": "11月23日", "url": "https://www.koreajoongangdaily.com/business/kospi-slips-33-as-ai-stock-selloff-hits-samsung-sk-hynix/12986396"}, "gist": "AIへの巨額の投資が本当に利益を生むのか、投資家が疑い始めている。AI向け半導体で稼ぐ韓国企業の株価は、その疑いを直接受けやすい。", "detail": ["前週末20日の米国市場ではナスダック総合指数が5.3%下落し、年初来の上昇分をすべて失った。", "韓国市場では指数が5.11%下げた時点で、プログラム売買が5分間止められた。", "台湾の加権指数は2.2%上げて取引を終え、アジアの中でも明暗が分かれた。"], "kw": ["SKハイニックス", "ナスダック総合指数"], "views": [{"type": "専門家", "who": "クーン・ゴー", "role": "ANZ銀行 アジア調査部門責任者", "stance": "今週もAI次第", "text": "今週もAIをめぐる懸念が相場を左右し、投資家は底が近いかどうかを見極めようとすると述べた。一方で、11月1〜20日の韓国の半導体輸出が前年同期比294.4%増えたことも指摘した。", "media": "アルジャジーラ", "url": "https://www.aljazeera.com/news/2026/11/23/south-koreas-stock-market-tumbles-as-ai-bubble-fears-mount"}, {"type": "専門家", "who": "ハン・ジヨン", "role": "キウム証券 アナリスト", "stance": "売り続く恐れ", "text": "AIへの懸念が続くなか、投資家がリスクを抑えようとして、さらに売りが出る可能性が高いと述べた。", "media": "Korea JoongAng Daily（聯合ニュース）", "url": "https://www.koreajoongangdaily.com/business/kospi-slips-33-as-ai-stock-selloff-hits-samsung-sk-hynix/12986396"}]},
{"cat": "tech", "loc": [1.56, 30.25, "ブニア（イトゥリ州）"], "region": "アフリカ", "accent": "#ff2e88", "title": "コンゴのエボラ、戦闘で対応チーム<span>足止め</span>", "lead": "コンゴ民主共和国東部で病院近くの戦闘が起き、エボラ対応のチームが24時間以上身を隠した。死者は5775人に達し、同国で過去最悪の流行は収まる見通しが立たない。", "src": {"name": "国連ニュース", "date": "11月23日", "url": "https://news.un.org/en/story/2026/11/1168858"}, "gist": "武力衝突が続く地域では、患者の治療や感染者の追跡が止まってしまう。流行の中心で保健活動が妨げられ、感染を抑え込む力が弱まっている。", "detail": ["WHOのテドロス事務局長は、職員が産科病棟に避難して身を守ったと明らかにし、安全な通行の保証を求めた。", "イトゥリ州だけで確認感染者は8000人を超え、全体の3分の2以上を占める。", "WHOは今年1月以降、コンゴで87件を超える医療への攻撃を確認している。"], "kw": ["イトゥリ州", "エボラ"], "views": [{"type": "当事者の声", "who": "テドロス・アダノム", "role": "WHO事務局長", "stance": "安全確保を要求", "text": "職員が命を守るため産科病棟に避難したと述べ、直ちに安全な通行を認め、病院の施設と職員、患者を守るよう求めた。", "media": "国連ニュース", "url": "https://news.un.org/en/story/2026/11/1168858"}, {"type": "当事者の声", "who": "国境なき医師団", "role": "国際医療人道団体", "stance": "支援が届かない", "text": "対応のために集められた多額の資源と、患者や現場の人々に実際に届いているものとの間に、気がかりなずれがあると指摘した。", "media": "AP通信（NSJ掲載）", "url": "https://nsjonline.com/article/2026/11/ebola-outbreak-out-of-control-congo/"}]},
{"cat": "tech", "loc": [11.35, 142.2, "チャレンジャー海淵"], "region": "太平洋", "accent": "#ffd60a", "title": "マリアナ海溝で<span>最深</span>の爆発的噴火の痕跡", "lead": "米テキサス大学ダラス校などのチームが、マリアナ海溝の水深約6100メートルの斜面で、爆発的な噴火でできた岩石を見つけた。海で確認された同種の岩石として最も深い。", "src": {"name": "Popular Science", "date": "11月23日", "url": "https://www.popsci.com/technology/volcanic-rock-discovery-maraiana-trench/"}, "gist": "地球で最も深い海の底の近くでも、激しい噴火が起きていたことになる。研究者は、チャレンジャー海淵がなぜこれほど深いのかを解く手がかりになるとみている。", "detail": ["無人潜水機「ジェイソン／メディア」が2024年後半に7回潜り、チャレンジャー海淵近くの約300キロの区間を調べた。", "岩石は急な西側の斜面に、薄く平らな層となって広がっていた。", "噴火が起きた場所は、まだ特定できていない。"], "kw": ["チャレンジャー海淵", "マリアナ海溝"], "views": [{"type": "専門家", "who": "ロバート・J・スターン", "role": "米テキサス大学ダラス校 地質学者、論文著者", "stance": "予想外の発見", "text": "海溝の近くで爆発的な火山活動が起きるのは珍しく、とても驚いたと述べた。噴火した場所はまだ見つかっていないとも話した。", "media": "Popular Science", "url": "https://www.popsci.com/technology/volcanic-rock-discovery-maraiana-trench/"}]},
{"cat": "world", "loc": [23.81, 90.41, "ダッカ"], "region": "アジア", "accent": "#2e7bff", "title": "バングラ、<span>ハシナ前首相</span>帰国なら逮捕", "lead": "バングラデシュのシャマ・オバエド外務担当国務相は、インドに逃れているハシナ前首相が帰国すれば直ちに逮捕すると述べた。ハシナ氏は12月の帰国を計画しており、国内では暴力が広がっている。", "src": {"name": "ロイター（Dawn掲載）", "date": "11月23日", "url": "https://www.dawn.com/news/2046532"}, "gist": "死刑判決を受けた元指導者の帰国計画が、国内の対立とインドとの関係を同時に揺さぶっている。インドが身柄を引き渡すかどうかが焦点だ。", "detail": ["ハシナ氏は2024年8月、辞任を求める抗議が広がるなかで出国し、それ以来インドに住んでいる。本国では死刑判決を受けている。", "国連によると、2024年の騒乱では最大1400人が死亡した。", "過去10日間に少なくとも28の県で手製爆弾の爆発や車両への放火が数十件起きたと地元メディアが伝えている。"], "kw": ["死刑判決", "インド"], "views": [{"type": "当事者の声", "who": "シャマ・オバエド・イスラム", "role": "バングラデシュ外務担当国務相", "stance": "送還を要求", "text": "インドに犯罪人引き渡し条約を守り、有罪判決を受けた者としてハシナ氏を送り返すよう求めた。最近の暴力は旧与党の生き残り策だと批判した。", "media": "TRTワールド（ロイター配信）", "url": "https://www.trtworld.com/article/4692eef0339f"}, {"type": "当事者の声", "who": "カリド・マフムード・チョードリー", "role": "アワミ連盟幹部", "stance": "政権側に責任", "text": "一連の暴力の責任は現在の政治権力の側にあると主張した。", "media": "Dawn（ロイター配信）", "url": "https://www.dawn.com/news/2046532"}]},
{"cat": "sports", "loc": [47.3769, 8.5417, "チューリッヒ（スイス）"], "region": "北中米・欧州", "accent": "#ff6b1a", "title": "女子W杯、2031年は<span>米国など4カ国</span>共催", "lead": "FIFAは23日、2031年女子W杯を米国・メキシコ・コスタリカ・ジャマイカの共催、2035年大会を英国開催とすることを決めた。両大会とも出場国が初めて48に増え、男子と同じ規模になる。", "src": {"name": "AP（PBS NewsHour掲載）", "date": "11月23日", "url": "https://www.pbs.org/newshour/world/u-s-to-co-host-2031-womens-world-cup-with-mexico-costa-rica-and-jamaica"}, "gist": "女子サッカー最大の大会が、出場国も試合数も男子並みに大きくなる。どちらの開催も対立候補がなく、すんなり決まった。", "detail": ["211の加盟協会によるオンライン会合で、両大会の開催案が拍手による承認で決まった。", "2031年大会の候補都市は20で、米国14、メキシコ4、コスタリカのサンホセ、ジャマイカのキングストンが含まれる。", "2035年大会はイングランドが中心となり、北アイルランド、スコットランド、ウェールズと共催し、ウェンブリー・スタジアムなど19会場が候補に挙がっている。"], "kw": ["48", "ウェンブリー・スタジアム"], "views": [{"type": "当事者の声", "who": "シンディ・パーロウ・コーン", "role": "米国サッカー連盟会長", "stance": "史上最大を約束", "text": "採決前のプレゼンテーションで、2031年大会は女子スポーツ史上最大のイベントになると述べ、だからこそ成功させなければならないと加盟協会に訴えた。", "media": "CBS News（AP）", "url": "https://www.cbsnews.com/news/us-host-2031-fifa-women-world-cup-announcement/"}, {"type": "当事者の声", "who": "マーク・ブリンガム", "role": "イングランドサッカー協会（FA）最高経営責任者", "stance": "競技人口拡大へ", "text": "1966年以来となる自国でのW杯で、長年の準備の成果だと述べた。大会は女子欧州選手権の8倍の規模になるとし、女子の競技人口を男子と同じにする目標につなげたいとした。", "media": "イングランドサッカー協会（The FA）", "url": "https://www.thefa.com/news/2026/nov/23/mark-bullingham-on-united-kingdom-hosting-2035-fifa-womens-world-cup-20261123"}]},
{"cat": "tech", "loc": [50.84, 4.38, "ブリュッセル"], "region": "欧州", "accent": "#b6ff2e", "title": "欧州委へのサイバー攻撃、<span>中国系</span>集団に疑い", "lead": "欧州委員会のIT網への侵入が1カ月たっても封じ込められず、中国の支援を受けた集団の関与が疑われているとユーロニュースが報じた。AIで弱点を探すツールが使われたとみられる。", "src": {"name": "Euronews", "date": "11月23日", "url": "https://www.euronews.com/2026/11/23/exclusive-china-backed-hackers-suspected-behind-ongoing-eu-commission-cyberattack"}, "gist": "EUの政策を動かす組織のネットワークに、侵入者が長く居座っている。中国政府はこうしたハッカー集団への支援をこれまで一貫して否定している。", "detail": ["委員会のIT部門が侵入者を見つけたのは10月22日で、内部では攻撃者を「パンダ」という符号で呼んでいる。", "若者向けの研修サイト「EUアカデミー」が停止され、利用者の名前とメールアドレスの流出が確認された。", "使われたとされる「ARTEX」は、マイクロソフトなどが中国系集団による利用を指摘してきたAI侵入ツールだ。"], "kw": ["ARTEX", "EUアカデミー"], "views": [{"type": "当事者の声", "who": "トマ・レニエ", "role": "欧州委員会 報道官", "stance": "特定は調査後", "text": "攻撃者の特定については、調査が終わるまで判断できないと述べた。", "media": "Euronews（Yahoo News掲載の更新版）", "url": "https://www.yahoo.com/news/world/articles/exclusive-china-backed-hackers-suspected-123921669.html"}, {"type": "専門家", "who": "アダム・マイヤーズ", "role": "米サイバー企業クラウドストライク幹部", "stance": "韓国も標的", "text": "ARTEXを使った攻撃では、韓国に関係する標的もいくつか確認されたと述べた。", "media": "SBS（韓国）", "url": "https://news.sbs.co.kr/english/article.do?news_id=N1008859779"}]},
{"cat": "world", "loc": [14.8, 42.95, "ホデイダ"], "region": "中東", "accent": "#8b5cff", "title": "フーシ派「サウジ空爆で<span>17人死亡</span>」", "lead": "イエメンのフーシ派は23日、ホデイダでサウジ主導連合軍の空爆により17人が死亡したと発表した。紅海沿岸で、サウジとフーシ派の攻撃の応酬が続いている。", "src": {"name": "The New Arab（AFP）", "date": "11月23日", "url": "https://www.newarab.com/news/yemens-houthis-say-saudi-attack-kills-17"}, "gist": "イエメン内戦の当事者同士が、紅海沿岸の通信施設や石油施設を狙い合っている。紅海の航路が不安定になれば、世界の物流にも響く。", "detail": ["フーシ派の通信省によると、空爆で17人が死亡、11人が負傷し、数万人の電話やネットが使えなくなった。AFPは独自に確認できていない。", "フーシ派は週末、サウジの紅海沿岸にあるラービグの製油所やジーザーン港を攻撃したと主張したが、サウジ側は被害を確認していない。", "国連によると、7月にフーシ派と政府側の停戦が崩れて以降、戦闘で1600人以上が死亡し、30万人以上が避難した。"], "kw": ["フーシ派", "ホデイダ"], "views": [{"type": "分析・データ", "who": "ガルフ・ニュース", "role": "UAEの英字紙（解説）", "stance": "航路への波及", "text": "イエメン西部の戦闘でバブ・エル・マンデブ海峡の安全への懸念が強まっていると指摘した。不安定化が続けば航路の迂回で保険料や運賃が上がり、配送も遅れうると分析した。", "media": "ガルフ・ニュース", "url": "https://gulfnews.com/uae/middle-east-war-5-things-uae-residents-need-to-know-tonight-nov-23-2026-1.500758468"}]},

const GTERMS = Object.keys(GLOSS).sort((a, b) => b.length - a.length);
const gloss = (html, used) => {
  for (const t of GTERMS){
    if (used.has(t)) continue;
    const e = esc(t); let i = html.indexOf(e);
    while (i > -1){
      const inTag = html.lastIndexOf("<", i) > html.lastIndexOf(">", i);
      const inBtn = html.lastIndexOf("<button", i) > html.lastIndexOf("</button>", i);
      if (!inTag && !inBtn) break;
      i = html.indexOf(e, i + 1);
    }
    if (i < 0) continue;
    used.add(t);
    html = html.slice(0, i) + `<button type="button" class="g" data-g="${e}" aria-expanded="false">${e}</button>` + html.slice(i + e.length);
  }
  return html;
};

function panes(n, no){
  const P = [], used = new Set(), T = h => gloss(h, used);
  P.push(`<div class="pane"><div class="in"><div class="tags"><span class="tag">${CAT[n.cat]}</span><span class="tag o">${esc(n.region)}</span><span class="tag o">全部で約${secs(n)}秒</span></div>
    <h2>${n.title}</h2><p class="lead">${T(color(n.lead, n.kw))}</p>
    <div class="src">出典：${link(esc(n.src.name), n.src.url)}・${esc(n.src.date)}</div>
    <div class="go">横に流すと詳細 <span>→</span></div></div></div>`);
  P.push(`<div class="pane"><div class="in"><div class="tags"><span class="tag y">ざっくり言うと</span></div><p class="big">${T(color(n.gist, n.kw))}</p></div></div>`);
  n.detail.forEach((d, k) => P.push(`<div class="pane"><div class="in"><div class="tags"><span class="tag">くわしい話 ${k+1}</span></div><p class="big xl">${T(color(d, n.kw))}</p>${k === n.detail.length-1 ? `<div class="src">出典：${link(esc(n.src.name), n.src.url)}（${esc(n.src.date)}）</div>` : ""}</div></div>`));
  n.views.forEach((v, k) => P.push(`<div class="pane"><div class="in"><div class="tags"><span class="tag w">${v.type === "専門家" ? "専門家の見解" : esc(v.type)} ${k+1} / ${n.views.length}</span><span class="tag o">${esc(v.stance)}</span></div>
    <div class="who">${esc(v.who)}</div><div class="role">${esc(v.role)}</div><p class="big">要約：${T(esc(v.text))}</p>
    <div class="src">出典：${link(esc(v.media), v.url)}</div>${k === n.views.length-1 ? `<p class="note">見解は発言や分析の要約です。「専門家の見解」は専門家本人、「当事者の声」は関係者・機関の説明、「分析・データ」は機関や媒体の分析です。${n.views.length < 2 ? "別の媒体で確認できた見解は1件だけのため、無理に増やしていません。" : ""}</p>` : ""}</div></div>`));
  return P;
}

/* 見出しの改行：文節（助詞・句読点のあと）でまとまりを作り、その途中では改行しない */
const PHRASE = /([^、。！？」）]*?(?:から|まで|より|とは|では|には|へは|は|が|を|に|で|と|の|へ|も|や|、|。|！|？|」|）)(?=[^ぁ-んー、。！？」）]|$)|[^、。！？」）]+$)/g;
const phrase = el => {
  const runs = [...el.childNodes].map(n => [n.textContent, n.nodeType === 1]);
  const text = runs.map(r => r[0]).join("");
  const parts = text.split(/(?=「|（)/).flatMap(x => x.match(PHRASE) || [x]).filter(Boolean);
  if (parts.join("") !== text) return;
  const acc = []; for (const [t, a] of runs) for (const _ of t) acc.push(a);
  el.textContent = ""; let k = 0;
  for (const x of parts){
    const ph = document.createElement("span"); ph.className = "ph";
    let buf = "", cur = acc[k];
    const flush = () => { if (!buf) return; if (cur){ const a = document.createElement("span"); a.textContent = buf; ph.appendChild(a); } else ph.appendChild(document.createTextNode(buf)); buf = ""; };
    for (const ch of x){ if (acc[k] !== cur){ flush(); cur = acc[k]; } buf += ch; k++; }
    flush(); el.appendChild(ph);
  }
};
function render(){
  list = ORDER.filter(i => cat === "all" || NEWS[i].cat === cat);
  const counts = {all:NEWS.length}; NEWS.forEach(n => counts[n.cat] = (counts[n.cat]||0) + 1);

  feed.innerHTML = list.map((i, k) => {
    const n = NEWS[i], P = panes(n, k), key = plain(n.title);
    return `<section class="card" data-k="${k}" style="--a:${n.accent}" aria-label="${esc(key)}">
      <div class="blob"></div><div class="num" aria-hidden="true">${String(ORDER.indexOf(i)+1).padStart(2,"0")}</div>

  }).join("") + othersCard() + closing();
  dotsEl.innerHTML = list.map(() => "<i></i>").join("") + (feed.querySelector(".others") ? "<i></i>" : "") + "<i></i>";
  $("#tot").textContent = list.length;
  feed.scrollTop = 0; setCur(0);

  }, {passive:true}));
  feed.querySelectorAll("h2").forEach(phrase);
  if (typeof fixBackno === "function") fixBackno();
  feed.querySelectorAll(".card").forEach(c => io.observe(c));
  if (typeof markTall === "function") requestAnimationFrame(markTall);
}

function setCur(k){
  cur = k;
  try { if (location.hash !== "#" + tag(k)) history.replaceState(null, "", "#" + tag(k)); } catch(e){}
  const atEnd = k >= list.length;
  $("#cur").textContent = Math.min(k + 1, list.length);
  const hasO = !!feed.querySelector(".others"), endK = list.length + (hasO ? 1 : 0);
  $("#nextL").textContent = k >= endK ? "最初にもどる" : k === list.length && hasO ? "まとめへ" : k === list.length - 1 ? (hasO ? "ほかのニュースへ" : "まとめへ") : "次のニュース";
  dotsEl.querySelectorAll("i").forEach((d, x) => d.classList.toggle("on", x === k));
  clearTimeout(dwell);
  if (!atEnd){ const key = plain(NEWS[list[k]].title); dwell = setTimeout(() => { if (cur === k && !read.has(key)){ read.add(key); store.set(KEY + "-read", [...read]); paintRead(); } }, 1200); }
}
let dwell = 0;
const paintRead = () => { $("#prog").style.width = Math.round(read.size / NEWS.length * 100) + "%"; };

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) setCur(e.target.classList.contains("others") ? list.length : e.target.classList.contains("end") ? list.length + (feed.querySelector(".others") ? 1 : 0) : +e.target.dataset.k); }), {root:feed, threshold:.6});

const go = k => feed.children[k]?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
const side = d => { const t = feed.children[cur]?.querySelector(".track"); if (t) t.scrollBy({left: d * t.clientWidth, behavior:"smooth"}); };

  if (l){ const k = l.dataset.key; liked.has(k) ? liked.delete(k) : liked.add(k); l.setAttribute("aria-pressed", liked.has(k)); store.set("dpg-liked", [...liked]); return; }
  const j = e.target.closest("[data-jump]");

document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea")) return;
  if (!document.getElementById("sheet").hidden) return;

if (ARCHIVED){ const l = $("#latest"); l.href = ROOT; l.hidden = false; }
const fixBackno = () => feed.querySelectorAll(".backno").forEach(a => a.href = ROOT + "archive/");

/* 号えらび：上の日付を押すと、保存されている号へすぐ移れる。号の目録は archive/days.json（tools/publish_day.py が作る） */
const sheet = $("#sheet"), dateBtn = $("#dateBtn"), strip = $("#strip");
$("#sheetAll").href = ROOT + "archive/";
let daysP = null, lastFocus = null;
const loadDays = () => daysP || (daysP = fetch(ROOT + "archive/days.json", {cache:"no-cache"})
  .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
  .catch(e => { daysP = null; throw e; }));
const paintDays = days => {
  if (!Array.isArray(days) || !days.length){ strip.innerHTML = '<p class="snote">まだ保存された号がありません。</p>'; return; }
  strip.innerHTML = days.map((d, i) => {
    const [, m, dd] = d.date.split("-"), here = d.date === DAY;
    const href = i === 0 ? ROOT : ROOT + "archive/" + d.date + "/";
    const badges = (i === 0 ? '<i>最新</i>' : "") + (here ? '<i class="now">表示中</i>' : "");
    return `<a class="day${here ? " here" : ""}" href="${esc(href)}"${here ? ' aria-current="page"' : ""}>
      <span class="dtop"><b>${+m}.${+dd}</b><small>${esc(d.wd)}曜</small></span><span class="badges">${badges}</span>
      <span class="dn">${+d.n}本</span><span class="dt">${esc(d.top || "")}</span></a>`;
  }).join("");
  const h = strip.querySelector(".here"); if (h) strip.scrollLeft = h.offsetLeft - 16;
};
const sheetFocus = () => [...sheet.querySelectorAll("a[href],button")];
const openSheet = () => {
  closePop(); lastFocus = document.activeElement;
  sheet.hidden = false; dateBtn.setAttribute("aria-expanded", "true");
  strip.innerHTML = '<p class="snote">読み込み中…</p>'; $("#sheetX").focus();
  loadDays().then(paintDays).catch(() => { strip.innerHTML = `<p class="snote">号の一覧を読み込めませんでした。<a href="${esc(ROOT + "archive/")}">過去の号の一覧</a>から選んでください。</p>`; })
    .finally(() => { if (!sheet.hidden){ const t = strip.querySelector(".here") || strip.querySelector(".day"); if (t) t.focus({preventScroll:true}); } });
};
const closeSheet = () => { if (sheet.hidden) return; sheet.hidden = true; dateBtn.setAttribute("aria-expanded", "false"); if (lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true}); };
dateBtn.addEventListener("click", () => sheet.hidden ? openSheet() : closeSheet());
$("#sheetX").addEventListener("click", closeSheet);
sheet.addEventListener("click", e => {
  if (e.target === sheet){ closeSheet(); return; }
  if (e.target.closest(".day.here")){ e.preventDefault(); closeSheet(); }
});
sheet.addEventListener("keydown", e => {
  if (e.key === "Escape"){ e.stopPropagation(); closeSheet(); return; }
  if (e.key !== "Tab") return;
  const f = sheetFocus(); if (!f.length) return;
  const i = f.indexOf(document.activeElement);
  if (e.shiftKey && i <= 0){ e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && i === f.length - 1){ e.preventDefault(); f[0].focus(); }
});
render();
openFromHash(START_HASH);
fixBackno();
markTall();
}
</script>
</body>
</html>
